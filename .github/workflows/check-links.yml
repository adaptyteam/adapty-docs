name: Check documentation links

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      check-type:
        description: 'Which links to check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - internal-only
          - external-only

jobs:
  internal-links:
    name: Check internal links
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.check-type == 'all' ||
      github.event.inputs.check-type == 'internal-only'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Exclude src/assets (689 MB — 87% of this repo's checkout payload).
          # The link checker never reads it. Setting sparse-checkout WITHOUT
          # `filter` makes actions/checkout add --filter=blob:none to the fetch,
          # so this cuts transferred bytes, not just working-tree writes.
          sparse-checkout: |
            /*
            !/src/assets
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install github-slugger puppeteer
      - run: node scripts/check-links/index.mjs --diff --base=origin/${{ github.event.pull_request.base.ref }} --internal-only
        if: github.event_name == 'pull_request'
      - run: node scripts/check-links/index.mjs --diff --base=last-production-deploy --internal-only
        if: github.event_name == 'workflow_dispatch'

  external-links:
    name: Check external links
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.check-type == 'all' ||
       github.event.inputs.check-type == 'external-only')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Exclude src/assets (87% of checkout bytes; unused by this job).
          # sparse-checkout without `filter` ⇒ fetch uses --filter=blob:none.
          sparse-checkout: |
            /*
            !/src/assets
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install github-slugger puppeteer
      - run: node scripts/check-links/index.mjs --external-only
