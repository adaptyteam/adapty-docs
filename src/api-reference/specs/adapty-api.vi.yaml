        access_level_id:
          type: string
          description: ID mức độ truy cập trả phí được cấu hình trong trang Access Levels
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: Thời điểm mức độ truy cập bắt đầu có hiệu lực. Có thể là thời điểm trong tương lai. Giá trị mặc định là null.
