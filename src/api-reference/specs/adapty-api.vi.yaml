    RevokeAccessRequest:
      type: object
      properties:
        access_level_id:
          type: string
          description: ID mức độ truy cập trả phí được cấu hình trong trang Access Levels
        revoke_at:
          type: string
          format: date-time
          nullable: true
          description: Chỉ định thời điểm mức độ truy cập sẽ hết hạn. Để thu hồi quyền truy cập ngay lập tức, hãy bỏ qua trường này hoặc đặt giá trị là null. Giá trị mặc định là null.
      required:
        - access_level_id
    RefundSaverSettingsRequest:
      type: object
      properties:
        custom_preference:
          type: string
          enum:
            - grant
            - grant_prorated
            - no_preference
            - decline
          nullable: true
          description: |
            Đặt tùy chọn hoàn tiền riêng cho người dùng. Áp dụng cho các yêu cầu hoàn tiền của người dùng trên cả App Store và Google Play. Google chỉ chấp nhận decline, approve hoặc no preference khi xem xét hoàn tiền, vì vậy Adapty gửi no preference trên Google Play khi giá trị này là `grant_prorated`.
            - `grant`: chấp thuận mọi yêu cầu hoàn tiền
            - `grant_prorated`: chấp thuận hoàn tiền cho phần sản phẩm mà người dùng chưa sử dụng
            - `no_preference`: không đưa ra bất kỳ khuyến nghị nào
            - `decline`: từ chối mọi yêu cầu hoàn tiền
        consent:
          type: boolean
          nullable: true
          description: |
            Ghi lại việc người dùng đã đồng ý chia sẻ dữ liệu của họ hay chưa. Sự đồng ý chỉ áp dụng cho App Store.
            - `true` có nghĩa là nếu bạn nhận được yêu cầu hoàn tiền trong ứng dụng, bạn có thể cung cấp cho Apple thông tin về người dùng
      example:
        custom_preference: grant
        consent: true
    RefundSaverSettingsResponse:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
          description: ID hồ sơ người dùng
        settings:
          type: object
          properties:
            consent:
              type: boolean
              description: Xác định liệu người dùng có đồng ý chia sẻ dữ liệu của họ với Apple hay không (chỉ dành cho App Store)
            custom_preference:
              type: string
              enum:
                - grant
                - grant_prorated
                - no_preference
                - decline
              description: Tùy chọn hoàn tiền
          description: Cài đặt refund saver cho người dùng
      required:
        - profile_id
        - settings
