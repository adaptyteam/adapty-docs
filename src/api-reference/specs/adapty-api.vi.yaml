  /api/v2/server-side-api/vc/transactions/:
    post:
      summary: Tạo giao dịch tiền tệ ảo
      description: |
        Ghi có hoặc ghi nợ một hoặc nhiều loại tiền tệ ảo cho một hồ sơ người dùng trong một giao dịch nguyên tử duy nhất. Sử dụng `amount` dương để ghi có (cấp) và `amount` âm để ghi nợ (tiêu). Tất cả các mục được áp dụng cùng nhau — nếu bất kỳ mục nào thất bại, không có mục nào được áp dụng.

        Mỗi mã tiền tệ chỉ được xuất hiện một lần trong mỗi yêu cầu. Việc ghi có thông qua endpoint này luôn tạo ra số dư không hết hạn.
      operationId: createVirtualCurrencyTransaction
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: ID duy nhất của khách hàng trong hệ thống của bạn. Cần có `adapty-customer-user-id` hoặc `adapty-profile-id`.
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: ID duy nhất của hồ sơ người dùng trong hệ thống của bạn. Lựa chọn tốt nhất nếu bạn đang làm việc với các hồ sơ ẩn danh. Cần có `adapty-customer-user-id` hoặc `adapty-profile-id`.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Một UUID v4 giúp yêu cầu trở nên idempotent. Nếu bạn thử lại yêu cầu với cùng một key, Adapty sẽ trả về kết quả của giao dịch gốc mà không thay đổi số dư lần nữa. Phải là UUID v4 hợp lệ.

            Các key được ghi nhớ trong tối đa một giờ, giới hạn trong phạm vi một hồ sơ người dùng duy nhất. Sau khoảng thời gian đó, yêu cầu với cùng key sẽ được áp dụng như một giao dịch mới — vì vậy hãy sử dụng key để thử lại lệnh gọi một cách an toàn, không phải để loại trừ trùng lặp việc cấp phép trong dài hạn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualCurrencyTransactionRequest'
            examples:
              debit:
                summary: Spend (debit) one currency
                value:
                  items:
                    - currency_code: COINS
                      amount: -10
              credit:
                summary: Grant (credit) one currency
                value:
                  items:
                    - currency_code: COINS
                      amount: 500
              multi_currency:
                summary: Debit two currencies at once
                value:
                  items:
                    - currency_code: GOLD
                      amount: -50
                    - currency_code: SILVER
                      amount: -200
              conversion:
                summary: Convert one currency into another
                value:
                  items:
                    - currency_code: SILVER
                      amount: -100
                    - currency_code: GOLD
                      amount: 10
                  metadata:
                    reason: exchange
      responses:
        '200':
          description: Giao dịch được áp dụng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionResponse'
              example:
                transaction_id: 0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90
                balances:
                  - code: COINS
                    name: Gold Coins
                    balance: 12950
                    held: 0
                    available: 12950
        '400':
          description: |
            Yêu cầu không hợp lệ. Trường `error_code` xác định nguyên nhân: `insufficient_balance`, `unknown_currency`, `duplicate_currency`, `amount_zero`, `balance_overflow`, `empty_items`, hoặc `idempotency_key_invalid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: currency_code
                    errors:
                      - Insufficient balance for currency COINS
                error_code: insufficient_balance
                status_code: 400
        '401':
          description: Không được phép. API key bị thiếu hoặc không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Bị từ chối. Server API cho tiền tệ ảo chưa được kích hoạt cho ứng dụng này. Liên hệ bộ phận hỗ trợ Adapty để yêu cầu quyền truy cập.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors:
                      - Server API for virtual currencies is not enabled for this app. Contact Adapty support to request access.
                error_code: feature_not_enabled
                status_code: 403
        '404':
          description: Không tìm thấy hồ sơ người dùng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Xung đột. Trường `error_code` xác định nguyên nhân:

            - `idempotency_in_flight` — một yêu cầu với cùng `Idempotency-Key` vẫn đang được xử lý. Thử lại sau khoảng thời gian trong response header `Retry-After`.
            - `duplicate_source_transaction` — giao dịch của cửa hàng cơ bản đã được ghi có, do đó không được áp dụng lại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors:
                      - A similar request is being processed.
                error_code: idempotency_in_flight
                status_code: 409
        '422':
          description: |
            Thực thể không thể xử lý. Nội dung yêu cầu không vượt qua xác thực schema — ví dụ: `items` chứa hơn 20 mục, hoặc một key hay giá trị trong `metadata` vi phạm các ràng buộc của nó.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Quá nhiều yêu cầu. Đã vượt quá giới hạn tốc độ trên mỗi ứng dụng hoặc giới hạn toàn cục (`error_code` là `rate_limited`). Giới hạn mặc định là 600 yêu cầu mỗi phút cho mỗi ứng dụng và 6000 yêu cầu mỗi phút trên toàn cục.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi máy chủ nội bộ
    get:
      summary: Liệt kê các giao dịch tiền tệ ảo
      description: |
        Trả về lịch sử giao dịch tiền tệ ảo cho một hồ sơ người dùng, mới nhất trước. Kết quả sử dụng phân trang con trỏ: khi response bao gồm `pagination.next_cursor` khác null, hãy truyền lại nó làm tham số truy vấn `cursor` để lấy trang tiếp theo.
      operationId: listVirtualCurrencyTransactions
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: ID duy nhất của khách hàng trong hệ thống của bạn. Cần có `adapty-customer-user-id` hoặc `adapty-profile-id`.
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: ID duy nhất của hồ sơ người dùng trong hệ thống của bạn. Lựa chọn tốt nhất nếu bạn đang làm việc với các hồ sơ ẩn danh. Cần có `adapty-customer-user-id` hoặc `adapty-profile-id`.
        - name: currency_code
          in: query
          required: false
          schema:
            type: string
          description: Lọc lịch sử theo một mã tiền tệ ảo duy nhất.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Con trỏ phân trang mờ được trả về dưới dạng `pagination.next_cursor` trong response trước đó. Bỏ qua để lấy trang đầu tiên.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Số lượng giao dịch tối đa trả về mỗi trang. Mặc định là 50.
      responses:
        '200':
          description: Lịch sử giao dịch được trả về thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryResponse'
              example:
                data:
                  - transaction_id: 0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90
                    transaction_type: api_transaction
                    items:
                      - currency_code: COINS
                        amount: 500
                        balance_after: 12950
                    metadata:
                      reason: promo_bonus
                    created_at: '2026-05-23T10:30:00Z'
                  - transaction_id: 0190e7b2-9a44-7c10-bb31-7d2e9f0a1c55
                    transaction_type: store_purchase
                    items:
                      - currency_code: COINS
                        amount: 1000
                        balance_after: 12450
                    created_at: '2026-05-22T18:05:12Z'
                  - transaction_id: 0190e5c0-3f18-7b9a-9e6d-44a1c8b27e03
                    transaction_type: subscription_renewal
                    items:
                      - currency_code: GEMS
                        amount: 200
                        balance_after: 3280
                    created_at: '2026-05-20T09:00:00Z'
                pagination:
                  next_cursor: MjAyNi0wNS0yMFQwOTowMDowMFowMTkwZTVjMC0zZjE4LTdiOWEtOWU2ZC00NGExYzhiMjdlMDM=
        '400':
          description: Yêu cầu không hợp lệ. Giá trị `cursor` không hợp lệ (`error_code` là `invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Không được phép. API key bị thiếu hoặc không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Bị từ chối. Server API cho tiền tệ ảo chưa được kích hoạt cho ứng dụng này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy hồ sơ người dùng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi máy chủ nội bộ
