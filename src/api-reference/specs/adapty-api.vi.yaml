      type: object
      description: Nội dung yêu cầu để tạo giao dịch tiền tệ ảo.
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: Các điều chỉnh số dư được áp dụng theo kiểu nguyên tử. Mỗi mã tiền tệ chỉ được xuất hiện một lần.
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceAdjustment'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            Các cặp khóa-giá trị tùy chọn được lưu cùng với giao dịch. Tối đa 5 khóa. Mỗi khóa phải khớp với `^[a-z0-9_]{1,30}$`, và mỗi giá trị có độ dài tối đa 200 ký tự.
      required:
        - items
    VirtualCurrencyBalanceAdjustment:
      type: object
      properties:
        currency_code:
          type: string
          description: Mã tiền tệ ảo cần điều chỉnh.
        amount:
          type: integer
          format: int32
          description: |
            Số lượng cần áp dụng. Giá trị dương sẽ cộng thêm (cấp) tiền tệ; giá trị âm sẽ trừ đi (tiêu dùng) tiền tệ. Không được bằng không.
      required:
        - currency_code
        - amount
    VirtualCurrencyTransactionResponse:
      type: object
      description: Kết quả của một giao dịch tiền tệ ảo.
      properties:
        transaction_id:
          type: string
          format: uuid
          description: ID duy nhất của giao dịch đã được tạo.
        balances:
          type: array
          description: |
            Số dư sau giao dịch cho mỗi loại tiền tệ bị ảnh hưởng bởi yêu cầu này (một mục cho mỗi phần tử trong `items`). Để đọc toàn bộ danh sách số dư của hồ sơ người dùng, hãy sử dụng `GET /api/v2/server-side-api/vc/balances/`.
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceSnapshot'
      required:
        - transaction_id
        - balances
    VirtualCurrencyBalanceSnapshot:
      type: object
      properties:
        code:
          type: string
          description: Mã tiền tệ ảo.
        name:
          type: string
          description: Tên hiển thị của tiền tệ ảo.
        balance:
          type: integer
          format: int32
          minimum: 0
          description: Tổng số dư, bao gồm các khoản đang được giữ.
        held:
          type: integer
          format: int32
          minimum: 0
          description: Tổng của tất cả các khoản giữ đang hoạt động (số tiền đã đặt trước). Hiện tại luôn là 0.
        available:
          type: integer
          format: int32
          description: Số dư có thể sử dụng, được tính bằng `balance - held`.
      required:
        - code
        - name
        - balance
        - held
        - available
    VirtualCurrencyBalanceListResponse:
      type: object
      description: Số dư hiện tại cho tất cả các loại tiền tệ ảo của hồ sơ người dùng.
      properties:
        response_created_at:
          type: integer
          format: int64
          description: Thời điểm phản hồi được tạo, dưới dạng Unix timestamp tính bằng mili giây.
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyProfileBalanceItem'
      required:
        - response_created_at
        - data
    VirtualCurrencyProfileBalanceItem:
      type: object
      properties:
        code:
          type: string
          description: Mã tiền tệ ảo duy nhất trong ứng dụng. Chữ cái ASCII, chữ số và dấu gạch dưới.
        name:
          type: string
          description: Tên hiển thị của tiền tệ ảo.
        balance:
          type: integer
          format: int32
          minimum: 0
          description: Tổng số dư, bao gồm các khoản hiện đang được giữ.
        held:
          type: integer
          format: int32
          minimum: 0
          description: Tổng của tất cả các khoản giữ đang hoạt động (số tiền được đặt trước). Hiện luôn là 0.
        available:
          type: integer
          format: int32
          description: Số dư có thể chi tiêu, được tính bằng `balance - held`.
      required:
        - code
        - name
        - balance
        - held
        - available
    VirtualCurrencyTransactionsHistoryResponse:
      type: object
      description: Danh sách phân trang các giao dịch tiền tệ ảo cho một hồ sơ người dùng.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryItem'
        pagination:
          $ref: '#/components/schemas/VirtualCurrencyHistoryPagination'
      required:
        - data
        - pagination
    VirtualCurrencyTransactionsHistoryItem:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
          description: ID duy nhất của giao dịch.
        transaction_type:
          type: string
          description: |
            Nguồn gốc của giao dịch. Một trong các giá trị: `store_purchase`, `subscription_renewal`, `trial_start`, `api_transaction`, `dashboard_transaction`, `refund`, hoặc `expiry`.
        items:
          type: array
          description: Thay đổi số dư theo từng loại tiền tệ được ghi lại trong giao dịch này.
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceChange'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Các cặp khóa-giá trị được lưu trữ cùng với giao dịch, nếu có.
        created_at:
          type: string
          format: date-time
          description: Thời điểm giao dịch được ghi lại.
      required:
        - transaction_id
        - transaction_type
        - items
        - created_at
    VirtualCurrencyBalanceChange:
      type: object
      properties:
        currency_code:
          type: string
          description: Mã tiền tệ ảo.
        amount:
          type: integer
          format: int32
          description: Thay đổi có dấu được áp dụng vào số dư. Giá trị dương là khoản ghi có, giá trị âm là khoản ghi nợ.
        balance_after:
          type: integer
          format: int32
          minimum: 0
          description: Số dư tiền tệ sau khi giao dịch này được áp dụng.
      required:
        - currency_code
        - amount
        - balance_after
    VirtualCurrencyHistoryPagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: |
            Con trỏ không rõ ràng cho trang tiếp theo. Truyền nó dưới dạng tham số truy vấn `cursor` để tải thêm kết quả. Null khi không còn trang nào nữa.
      required:
        - next_cursor
