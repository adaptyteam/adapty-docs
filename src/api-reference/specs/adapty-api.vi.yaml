components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      name: Authorization
      in: header
      default: Api-Key {Your secret API key}
      description: |
        Các yêu cầu API phải được xác thực bằng secret API key của bạn trong header **Authorization**
        với giá trị `Api-Key {your_secret_api_key}`, ví dụ:
        `Api-Key secret_live_...`. Tìm key này trong Adapty Dashboard ->
        **App Settings** -> **General** tab -> **API keys** section.
  requestBodies:
    DefaultJson:
      required: true
      content:
        application/json:
          schema:
            type: object
  schemas:
    ProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          description: Tên của người dùng cuối của bạn
        last_name:
          type: string
          nullable: true
          description: Họ của người dùng cuối của bạn
        gender:
          type: string
          nullable: true
          enum:
            - f
            - m
            - o
          description: Giới tính của người dùng cuối của bạn
        email:
          type: string
          nullable: true
          format: email
          description: Email của người dùng cuối của bạn
        phone_number:
          type: string
          nullable: true
          description: Số điện thoại của người dùng cuối của bạn
        birthday:
          type: string
          format: date
          nullable: true
          description: Ngày sinh của người dùng cuối của bạn
        ip_country:
          type: string
          nullable: true
          description: Quốc gia của người dùng cuối dưới dạng mã ISO 3166-1 alpha-2 gồm hai chữ cái, ví dụ `FR`
        ip_v4_address:
          type: string
          nullable: true
          description: Địa chỉ IPv4 của người dùng cuối
        store_country:
          type: string
          nullable: true
          description: Quốc gia của cửa hàng ứng dụng của người dùng cuối dưới dạng mã ISO 3166-1 alpha-2 gồm hai chữ cái, ví dụ `US`
        store:
          type: string
          nullable: true
          enum:
            - app_store
            - play_store
            - stripe
            - adapty
            - paddle
          description: Nền tảng người dùng sử dụng để thực hiện in-app purchase trong ứng dụng của bạn
        store_account_token:
          type: string
          format: uuid
          nullable: true
          description: Token tài khoản cửa hàng
        att_status:
          type: integer
          nullable: true
          enum:
            - 0
            - 1
            - 2
            - 3
          description: Trạng thái Apple App Tracking Transparency (0=chưa xác định, 1=bị hạn chế, 2=bị từ chối, 3=đã cho phép)
        analytics_disabled:
          type: boolean
          nullable: true
          description: Tùy chọn để từ chối analytics bên ngoài
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: Cho phép thiết lập tối đa 30 thuộc tính tùy chỉnh cho hồ sơ người dùng
        installation_meta:
          $ref: '#/components/schemas/InstallationMeta'
      required:
        - installation_meta
      example:
        first_name: Jane
        last_name: Doe
        gender: f
        email: jane.doe@example.com
        phone_number: '+1234567890'
        birthday: '2000-12-31'
        ip_country: FR
        ip_v4_address: 192.168.1.1
        store_country: US
        store: app_store
        store_account_token: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        att_status: 3
        analytics_disabled: true
        custom_attributes:
          - key: favourite_sport
            value: yoga
        installation_meta:
          device_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          device: iPhone 15 Pro
          locale: en
          os: iOS 17.1
          platform: iOS
          timezone: Europe/Rome
          user_agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_1_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1
          app_build: 1.0.0
          app_version: 1.0.0
          adapty_sdk_version: 2.0.0
          idfa: EA7583CD-A667-48BC-B806-42ECB2B48333
          idfv: E9D48DA5-3930-4B41-8521-D953AECD2F33
          advertising_id: ''
          android_id: ''
          android_app_set_id: ''
    ProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Profile'
      required:
        - data
    Profile:
      type: object
      properties:
        app_id:
          type: string
          format: uuid
          description: ID nội bộ của ứng dụng của bạn
        profile_id:
          type: string
          format: uuid
          description: ID hồ sơ người dùng Adapty
        customer_user_id:
          type: string
          nullable: true
          description: ID của người dùng trong hệ thống của bạn
        total_revenue_usd:
