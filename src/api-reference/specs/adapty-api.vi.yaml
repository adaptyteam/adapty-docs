        **Lưu ý quan trọng:** Nếu bạn cập nhật Remote Config, toàn bộ Remote Config hiện có sẽ bị ghi đè! Nếu bạn cần giữ lại các Remote Config hiện có, trước tiên hãy lấy paywall. Sau đó, sao chép remote_configs từ đó và chỉnh sửa các đối tượng bạn cần trong yêu cầu cập nhật.
      operationId: updatePaywall
      tags:
        - Paywalls
      security:
        - apikeyAuth: []
      parameters:
        - name: paywall_id
          in: path
          required: true
          schema:
