        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: ID duy nhất của hồ sơ người dùng trong hệ thống của bạn. Lựa chọn tốt nhất nếu bạn đang làm việc với hồ sơ người dùng ẩn danh. Yêu cầu phải có `adapty-customer-user-id` hoặc `adapty-profile-id`.
      responses:
        '200':
          description: Thu hồi mức độ truy cập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Không được phép
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy hồ sơ người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi máy chủ nội bộ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAccessRequest'
            examples:
              immediate_revoke:
                summary: Thu hồi quyền truy cập ngay lập tức
                value:
                  access_level_id: premium
              scheduled_revoke:
                summary: Lên lịch thu hồi quyền truy cập
                value:
                  access_level_id: premium
                  revoke_at: '2024-12-31T23:59:59Z'
  /api/v2/server-side-api/purchase/profile/refund-saver/settings/:
    get:
      summary: Lấy cài đặt Refund Saver
      description: Lấy tùy chọn Refund Saver cho người dùng này - liệu Adapty có nên yêu cầu cửa hàng từ chối hay chấp thuận yêu cầu hoàn tiền của họ. Tùy chọn là một giá trị áp dụng cho cả App Store và Google Play. Đồng thời lấy tùy chọn chia sẻ dữ liệu cho người dùng này – liệu người dùng có đồng ý chia sẻ dữ liệu của họ với Apple hay không. Sự đồng ý chỉ áp dụng cho App Store.
      operationId: getRefundSaverSettings
      tags:
        - Refund Saver
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: ID duy nhất của khách hàng trong hệ thống của bạn. Bắt buộc phải có `adapty-customer-user-id` hoặc `adapty-profile-id`.
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
