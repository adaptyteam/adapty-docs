    RefundSaverSettingsRequest:
      type: object
      properties:
        custom_preference:
          type: string
          enum:
            - grant
            - grant_prorated
            - no_preference
            - decline
          nullable: true
          description: |
            ユーザーに対して個別に返金の設定を行います。
            - `grant`: すべての返金リクエストを承認する
            - `grant_prorated`: ユーザーがまだ消費していない購入分に対して返金を承認する
            - `no_preference`: 推奨事項を提供しない
            - `decline`: すべての返金リクエストを拒否する
        consent:
          type: boolean
          nullable: true
          description: |
            ユーザーがデータ共有に同意したかどうかを記録します。
            - `true` はアプリ内返金リクエストを受信した場合に、ユーザーに関する情報を Apple に提供できることを意味します
      example:
        custom_preference: grant
        consent: true
