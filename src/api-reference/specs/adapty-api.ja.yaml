      description: |
        1回のアトミックトランザクションで、プロファイルに対して1つ以上の仮想通貨をクレジットまたはデビットします。クレジット（付与）する場合は正の `amount` を、デビット（消費）する場合は負の `amount` を使用してください。すべての項目は一括で適用されます — いずれかの項目が失敗した場合、何も適用されません。

        通貨コードはリクエストごとに1回のみ使用できます。このエンドポイントを通じたクレジットは、常に有効期限なしの残高を作成します。
      operationId: createVirtualCurrencyTransaction
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: お客様のシステムにおける顧客の一意のID。`adapty-customer-user-id` または `adapty-profile-id` のいずれかが必須です。
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: お客様のシステムにおけるプロファイルの一意のID。匿名プロファイルを扱う場合に最適な選択肢です。`adapty-customer-user-id` または `adapty-profile-id` のいずれかが必須です。
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            リクエストを冪等にするUUID v4。同じキーでリクエストを再試行した場合、Adaptyは残高を再度変更することなく元のトランザクションの結果を返します。有効なUUID v4である必要があります。

            キーは最大1時間、単一プロファイルのスコープで記憶されます。その期間を過ぎると、同じキーでのリクエストは新しいトランザクションとして適用されます — つまり、このキーは長期的な付与の重複排除ではなく、安全にコールを再試行するために使用してください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualCurrencyTransactionRequest'
            examples:
              debit:
                summary: 1つの通貨を消費（デビット）する
                value:
                  items:
                    - currency_code: COINS
                      amount: -10
              credit:
                summary: 1つの通貨を付与（クレジット）する
                value:
                  items:
                    - currency_code: COINS
                      amount: 500
              multi_currency:
                summary: 2つの通貨を同時にデビットする
                value:
                  items:
                    - currency_code: GOLD
                      amount: -50
                    - currency_code: SILVER
                      amount: -200
              conversion:
                summary: 一方の通貨を他方に変換する
                value:
                  items:
                    - currency_code: SILVER
                      amount: -100
                    - currency_code: GOLD
                      amount: 10
                  metadata:
                    reason: exchange
      responses:
        '200':
          description: トランザクションが正常に適用されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionResponse'
              example:
                transaction_id: 0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90
                balances:
                  - code: COINS
                    name: Gold Coins
                    balance: 12950
                    held: 0
                    available: 12950
        '400':
          description: |
            不正なリクエスト。`error_code` フィールドが原因を示します: `insufficient_balance`、`unknown_currency`、`duplicate_currency`、`amount_zero`、`balance_overflow`、`empty_items`、または `idempotency_key_invalid`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: currency_code
                    errors:
                      - Insufficient balance for currency COINS
                error_code: insufficient_balance
                status_code: 400
        '401':
          description: 認証エラー。APIキーが見つからないか無効です。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 禁止。このアプリでは仮想通貨のServer APIが有効になっていません。アクセスをリクエストするにはAdaptyサポートにお問い合わせください。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors:
                      - Server API for virtual currencies is not enabled for this app. Contact Adapty support to request access.
                error_code: feature_not_enabled
                status_code: 403
        '404':
          description: プロファイルが見つかりません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            競合。`error_code` フィールドが原因を示します:

            - `idempotency_in_flight` — 同じ `Idempotency-Key` を持つリクエストがまだ処理中です。`Retry-After` レスポンスヘッダーの間隔後に再試行してください。
            - `duplicate_source_transaction` — 基となるストアトランザクションはすでにクレジット済みのため、再度適用されません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors:
                      - A similar request is being processed.
                error_code: idempotency_in_flight
                status_code: 409
        '422':
          description: |
            処理不可能なエンティティ。リクエストボディがスキーマバリデーションに失敗しました — たとえば、`items` に20件を超えるエントリが含まれているか、`metadata` のキーまたは値が制約に違反している場合などです。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            リクエスト過多。アプリごとまたはグローバルのレート制限を超えました（`error_code` は `rate_limited`）。デフォルトの制限は、アプリごとに1分あたり600リクエスト、グローバルで1分あたり6000リクエストです。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部サーバーエラー
    get:
      summary: 仮想通貨トランザクションの一覧を取得する
      description: |
        プロファイルの仮想通貨トランザクション履歴を新しい順に返します。結果はカーソルページネーションを使用します: レスポンスに `pagination.next_cursor` が null でない値で含まれている場合、それを `cursor` クエリパラメータとして渡すことで次のページを取得できます。
      operationId: listVirtualCurrencyTransactions
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: お客様のシステムにおける顧客の一意のID。`adapty-customer-user-id` または `adapty-profile-id` のいずれかが必須です。
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: お客様のシステムにおけるプロファイルの一意のID。匿名プロファイルを扱う場合に最適な選択肢です。`adapty-customer-user-id` または `adapty-profile-id` のいずれかが必須です。
        - name: currency_code
          in: query
          required: false
          schema:
            type: string
          description: 履歴を単一の仮想通貨コードでフィルタリングします。
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 前のレスポンスで `pagination.next_cursor` として返された不透明なページネーションカーソル。最初のページを取得するには省略してください。
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: 1ページあたりに返すトランザクションの最大件数。デフォルトは50件です。
      responses:
        '200':
          description: トランザクション履歴が正常に返されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryResponse'
              example:
                data:
                  - transaction_id: 0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90
                    transaction_type: api_transaction
                    items:
                      - currency_code: COINS
                        amount: 500
                        balance_after: 12950
                    metadata:
                      reason: promo_bonus
                    created_at: '2026-05-23T10:30:00Z'
                  - transaction_id: 0190e7b2-9a44-7c10-bb31-7d2e9f0a1c55
                    transaction_type: store_purchase
                    items:
                      - currency_code: COINS
                        amount: 1000
                        balance_after: 12450
                    created_at: '2026-05-22T18:05:12Z'
                  - transaction_id: 0190e5c0-3f18-7b9a-9e6d-44a1c8b27e03
                    transaction_type: subscription_renewal
                    items:
                      - currency_code: GEMS
                        amount: 200
                        balance_after: 3280
                    created_at: '2026-05-20T09:00:00Z'
                pagination:
                  next_cursor: MjAyNi0wNS0yMFQwOTowMDowMFowMTkwZTVjMC0zZjE4LTdiOWEtOWU2ZC00NGExYzhiMjdlMDM=
        '400':
          description: 不正なリクエスト。`cursor` の値が無効です（`error_code` は `invalid_cursor`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証エラー。APIキーが見つからないか無効です。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 禁止。このアプリでは仮想通貨のServer APIが有効になっていません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: プロファイルが見つかりません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部サーバーエラー
  /api/v2/server-side-api/vc/balances/:
    get:
      summary: 仮想通貨残高の一覧取得
      description: |
        プロファイルのすべての仮想通貨の現在の残高を返します。アプリに仮想通貨が存在しない場合、`data` は空の配列になります。
      operationId: listVirtualCurrencyBalances
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: お客様のシステムにおけるカスタマーの一意のID。`adapty-customer-user-id` または `adapty-profile-id` のいずれかが必須です。
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: お客様のシステムにおけるプロファイルの一意のID。匿名プロファイルを扱う場合に最適な選択肢です。`adapty-customer-user-id` または `adapty-profile-id` のいずれかが必須です。
      responses:
        '200':
          description: 残高が正常に返されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyBalanceListResponse'
              example:
                response_created_at: 1779791400000
                data:
                  - code: COINS
                    name: Gold Coins
                    balance: 12450
                    held: 0
                    available: 12450
                  - code: GEMS
                    name: Gems
                    balance: 3280
                    held: 0
                    available: 3280
                  - code: ENERGY
                    name: Energy
                    balance: 840
                    held: 0
                    available: 840
        '400':
          description: リクエストが不正です。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証エラー。APIキーが存在しないか無効です。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: アクセス拒否。このアプリでは仮想通貨向けのServer APIが有効化されていません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: プロファイルが見つかりません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部サーバーエラー
components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      name: Authorization
      in: header
      default: Api-Key {Your secret API key}
      description: |
        APIリクエストは、シークレットAPIキーを **Authorization** ヘッダーに `Api-Key {your_secret_api_key}` の形式で設定することで認証されます。例えば、`Api-Key secret_live_...` のように指定します。このキーは Adapty ダッシュボード -> **App Settings** -> **General** タブ -> **API keys** セクションで確認できます。
  requestBodies:
    DefaultJson:
      required: true
      content:
        application/json:
          schema:
            type: object
  schemas:
    ProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          description: エンドユーザーの名
        last_name:
          type: string
          nullable: true
          description: エンドユーザーの姓
        gender:
          type: string
          nullable: true
          enum:
            - f
            - m
            - o
          description: エンドユーザーの性別
        email:
          type: string
          nullable: true
          format: email
          description: エンドユーザーのメールアドレス
        phone_number:
          type: string
          nullable: true
          description: エンドユーザーの電話番号
        birthday:
          type: string
          format: date
          nullable: true
          description: エンドユーザーの誕生日
        ip_country:
          type: string
          nullable: true
          description: エンドユーザーの国を表す2文字のISO 3166-1 alpha-2コード（例：`FR`）
        ip_v4_address:
          type: string
          nullable: true
          description: エンドユーザーのIPv4アドレス
        store_country:
          type: string
          nullable: true
          description: エンドユーザーのアプリストアの国を表す2文字のISO 3166-1 alpha-2コード（例：`US`）
        store:
          type: string
          nullable: true
          enum:
            - app_store
            - play_store
            - stripe
            - adapty
            - paddle
          description: ユーザーがアプリ内で購入に使用するプラットフォーム
        store_account_token:
          type: string
          format: uuid
          nullable: true
          description: ストアアカウントトークン
        att_status:
          type: integer
          nullable: true
          enum:
            - 0
            - 1
            - 2
            - 3
          description: Apple App Tracking Transparencyのステータス（0=未確定、1=制限、2=拒否、3=許可）
        analytics_disabled:
          type: boolean
          nullable: true
          description: 外部アナリティクスをオプトアウトするオプション
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: プロファイルに最大30個のカスタム属性を設定できます
        installation_meta:
          $ref: '#/components/schemas/InstallationMeta'
      required:
        - installation_meta
      example:
        first_name: Jane
        last_name: Doe
        gender: f
        email: jane.doe@example.com
        phone_number: '+1234567890'
        birthday: '2000-12-31'
        ip_country: FR
        ip_v4_address: 192.168.1.1
        store_country: US
        store: app_store
        store_account_token: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        att_status: 3
        analytics_disabled: true
        custom_attributes:
          - key: favourite_sport
            value: yoga
        installation_meta:
          device_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          device: iPhone 15 Pro
          locale: en
          os: iOS 17.1
          platform: iOS
          timezone: Europe/Rome
          user_agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_1_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1
          app_build: 1.0.0
          app_version: 1.0.0
          adapty_sdk_version: 2.0.0
          idfa: EA7583CD-A667-48BC-B806-42ECB2B48333
          idfv: E9D48DA5-3930-4B41-8521-D953AECD2F33
          advertising_id: ''
          android_id: ''
          android_app_set_id: ''
    ProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Profile'
      required:
        - data
    Profile:
      type: object
      properties:
        app_id:
          type: string
          format: uuid
          description: アプリの内部ID
        profile_id:
          type: string
          format: uuid
          description: AdaptyのプロファイルID
        customer_user_id:
          type: string
          nullable: true
          description: お客様のシステムにおけるユーザーのID
        total_revenue_usd:
          type: number
          format: float
          description: プロファイルで獲得した総収益（USD）を表すfloat値
        segment_hash:
          type: string
          description: 内部パラメーター
        timestamp:
          type: integer
          format: int64
          description: レスポンス時間（ミリ秒）。競合状態の解決に使用します
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: プロファイルに設定できるカスタム属性は最大30件です
        access_levels:
          type: array
          items:
            $ref: '#/components/schemas/AccessLevel'
          description: アクセスレベルオブジェクトの配列。顧客がアクセスレベルを持っていない場合は空の配列
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
          description: サブスクリプションオブジェクトの配列。顧客がサブスクリプションを持っていない場合は空の配列
        non_subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/NonSubscription'
          description: 買い切り購入オブジェクトの配列。顧客が購入履歴を持っていない場合は空の配列
      required:
        - app_id
        - profile_id
        - customer_user_id
        - total_revenue_usd
        - segment_hash
        - timestamp
        - custom_attributes
        - access_levels
        - subscriptions
        - non_subscriptions
    CustomAttribute:
      type: object
      properties:
        key:
          type: string
          maxLength: 30
          description: キーは30文字以下の文字列である必要があります。使用できるのは英字、数字、ダッシュ、ピリオド、アンダースコアのみです
        value:
          oneOf:
            - type: string
            - type: number
          description: 属性値は50文字以下である必要があります。値として使用できるのは文字列と浮動小数点数のみです
      required:
        - key
        - value
    InstallationMeta:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: デバイスの一意識別子
        device:
          type: string
          nullable: true
          description: デバイス情報
        locale:
          type: string
          nullable: true
          description: デバイスのロケール
        os:
          type: string
          nullable: true
          description: オペレーティングシステム情報
        platform:
          type: string
          nullable: true
          enum:
            - iOS
            - macOS
            - iPadOS
            - Android
            - visionOS
            - web
          description: プラットフォーム（iOS、Android など）
        timezone:
          type: string
          nullable: true
          description: デバイスのタイムゾーン
        user_agent:
          type: string
          nullable: true
          description: ユーザーエージェント文字列
        app_build:
          type: string
          nullable: true
          description: アプリのビルドバージョン
        app_version:
          type: string
          nullable: true
          description: アプリのバージョン
        adapty_sdk_version:
          type: string
          nullable: true
          description: Adapty SDK のバージョン
        idfa:
          type: string
          nullable: true
          description: iOS の広告識別子（IDFA）
        idfv:
          type: string
          nullable: true
          description: iOS のベンダー識別子（IDFV）
        advertising_id:
          type: string
          nullable: true
          description: Android の広告 ID
        android_id:
          type: string
          nullable: true
          description: Android のデバイス ID
        android_app_set_id:
          type: string
          nullable: true
          description: Android のアプリセット ID
      required:
        - device_id
    AccessLevel:
      type: object
      properties:
        access_level_id:
          type: string
          description: アクセスレベルの識別子
        store:
          type: string
          description: アクセスレベルが購入されたストア
        store_product_id:
          type: string
          description: ストア内のプロダクトID
        store_base_plan_id:
          type: string
          nullable: true
          description: ストア内のベースプランID
        store_transaction_id:
          type: string
          description: ストア内のトランザクションID
        store_original_transaction_id:
          type: string
          description: ストア内の元のトランザクションID
        offer:
          allOf:
            - $ref: '#/components/schemas/OfferDTO'
          nullable: true
          description: プロモーションオファーまたは初回オファーが適用された場合のオファーの詳細
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: アクセスレベルが開始される日時
        purchased_at:
          type: string
          format: date-time
          description: アクセスレベルが購入された日時
        originally_purchased_at:
          type: string
          format: date-time
          description: アクセスレベルが最初に購入された日時
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: アクセスレベルが期限切れになる日時
        renewal_cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: 更新がキャンセルされた日時
        billing_issue_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 請求の問題が検出された日時
        is_in_grace_period:
          type: boolean
          description: アクセスレベルがグレース期間中かどうか
        cancellation_reason:
          type: string
          nullable: true
          description: キャンセルの理由
    Subscription:
      type: object
      properties:
        store:
          type: string
          description: サブスクリプションが購入されたストア
        store_product_id:
          type: string
          description: ストア内のプロダクトID
        store_base_plan_id:
          type: string
          nullable: true
          description: ストア内のベースプランID
        store_transaction_id:
          type: string
          description: ストア内のトランザクションID
        store_original_transaction_id:
          type: string
          description: ストア内の元のトランザクションID
        offer:
          allOf:
            - $ref: '#/components/schemas/OfferDTO'
          nullable: true
          description: プロモーションオファーまたは初回オファーが適用された場合のオファー詳細
        environment:
          type: string
          description: 環境（サンドボックス、本番）
        purchased_at:
