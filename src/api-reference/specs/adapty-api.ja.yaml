          properties:
            pagination:
              type: object
              properties:
                count:
                  type: integer
                  description: ペイウォールの総数
                page:
                  type: integer
                  description: 現在のページ番号
                pages:
                  type: integer
                  description: 総ページ数
              required:
                - count
                - page
                - pages
          required:
            - pagination
      required:
        - data
        - meta
    PaywallListItem:
      type: object
      properties:
        title:
          type: string
          description: Adapty ダッシュボードで定義されたペイウォールの名前
        paywall_id:
          type: string
          format: uuid
          description: ペイウォールの一意識別子
        use_paywall_builder:
          type: boolean
          description: ペイウォールビルダーを使用しているかどうか
        use_paywall_builder_legacy:
          type: boolean
          description: レガシーペイウォールビルダーを使用しているかどうか
        updated_at:
          type: string
          format: date-time
          description: ペイウォールが最後に更新されたタイムスタンプ
        created_at:
          type: string
          format: date-time
          description: ペイウォールが作成されたタイムスタンプ
        state:
          type: string
          enum:
            - draft
            - live
            - inactive
            - archived
          description: ペイウォールの現在の状態
        is_deleted:
          type: boolean
          description: ペイウォールが削除済みとしてマークされているかどうか
        web_purchase_url:
          type: string
          format: uri
          nullable: true
          description: 該当する場合、ウェブ購入用の URL
        products:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                format: uuid
                description: プロダクトの一意識別子
              title:
                type: string
                description: プロダクトのタイトル
              product_set:
                type: string
                enum:
                  - weekly
                  - monthly
                  - trimonthly
                  - semiannual
                  - annual
                  - lifetime
                  - uncategorised
                  - nonsubscriptions
                  - two_months
                  - consumable
                description: プロダクトセットのカテゴリ
              offer:
                type: object
                nullable: true
                properties:
                  product_offer_id:
                    type: string
                    format: uuid
                    description: プロダクトオファーの一意識別子
                  title:
                    type: string
                    description: オファーのタイトル
                required:
                  - product_offer_id
                  - title
            required:
              - product_id
              - title
              - product_set
              - offer
          description: ペイウォールのプロダクト情報を含むプロダクトオブジェクトの配列
      required:
        - title
        - paywall_id
        - use_paywall_builder
        - use_paywall_builder_legacy
        - updated_at
        - created_at
        - state
        - is_deleted
        - products
    PaywallObject:
      type: object
      description: |
        ペイウォールはアプリ内のマネタイズ画面を表します。ペイウォールの設定、プロダクト、およびリモートコンフィグに関する情報が含まれます。
      properties:
        title:
          type: string
          description: Adapty ダッシュボードで定義されたペイウォールの名前
        paywall_id:
          type: string
          format: uuid
          description: ペイウォールの一意の識別子
        use_paywall_builder:
          type: boolean
          description: ペイウォールがペイウォールビルダーを使用しているかどうか
        use_paywall_builder_legacy:
          type: boolean
          description: ペイウォールがレガシーペイウォールビルダーを使用しているかどうか
        updated_at:
          type: string
          format: date-time
          description: ペイウォールが最後に更新されたタイムスタンプ
        created_at:
          type: string
          format: date-time
          description: ペイウォールが作成されたタイムスタンプ
        state:
          type: string
          enum:
            - draft
            - live
            - inactive
            - archived
          description: ペイウォールの現在の状態
        is_deleted:
          type: boolean
          description: ペイウォールが削除済みとしてマークされているかどうか
        web_purchase_url:
          type: string
          format: uri
          nullable: true
          description: ウェブ購入用のURL（該当する場合）
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductObject'
          description: このペイウォールで利用可能なプロダクトの配列
        remote_configs:
          type: array
          items:
            $ref: '#/components/schemas/RemoteConfigObject'
          description: 各ロケール向けのリモートコンフィグの配列
        main_screenshot:
          type: object
          nullable: true
          properties:
            image_id:
              type: integer
              description: 画像の一意の識別子
            url:
              type: string
              format: uri
              description: 画像のURL
          required:
            - image_id
            - url
          description: image_id と url を含むメインスクリーンショットオブジェクト
      required:
        - title
        - paywall_id
        - use_paywall_builder
        - use_paywall_builder_legacy
        - updated_at
        - created_at
        - state
        - is_deleted
        - products
    ProductObject:
      type: object
      description: |
        プロダクトはアプリ内で購入可能なアイテムを表します。サブスクリプションまたは
        買い切り購入プロダクトのいずれかです。
      properties:
        product_id:
          type: string
          format: uuid
          description: プロダクトの一意識別子
        title:
          type: string
          description: プロダクトのタイトル
        product_set:
          type: string
          description: プロダクトセットのカテゴリ
        offer:
          type: object
          nullable: true
          properties:
            product_offer_id:
              type: string
              format: uuid
              description: プロダクトオファーの一意識別子
            title:
              type: string
              description: オファーのタイトル
          required:
            - product_offer_id
            - title
          description: プロダクトオファー情報
      required:
        - product_id
        - title
        - product_set
        - offer
    RemoteConfigObject:
      type: object
      description: |
        リモートコンフィグには、ペイウォールのロケール固有の設定データが含まれています。
        これにより、異なる言語に対してペイウォールの外観と動作をカスタマイズできます。
      properties:
        locale:
          type: string
          description: リモートコンフィグのロケール（例："en"、"es"、"fr"）
        data:
          type: string
          description: リモートコンフィグデータを含むJSON文字列
      required:
        - locale
        - data
    IntegrationIdentifiersObject:
      type: object
      description: |
        インテグレーション識別子には、さまざまなサードパーティサービスのユーザーIDが含まれます。
        これらは、異なるアナリティクスおよびマーケティングプラットフォーム間でユーザーデータを同期するために使用されます。
      properties:
        adjust_device_id:
          type: string
          nullable: true
          description: AdjustインテグレーションにおけるネットワークユーザーのID
        airbridge_device_id:
          type: string
          nullable: true
          description: AirbridgeインテグレーションにおけるユーザーデバイスのID
        amplitude_device_id:
          type: string
          nullable: true
          description: AmplitudeインテグレーションにおけるユーザーデバイスのID
        amplitude_user_id:
          type: string
          nullable: true
          description: AmplitudeインテグレーションにおけるユーザーのID
        appmetrica_device_id:
          type: string
          nullable: true
          description: AppMetricaインテグレーションにおけるユーザーデバイスのID
        appmetrica_profile_id:
          type: string
          nullable: true
          description: AppMetricaインテグレーションにおけるユーザーのID
        appsflyer_id:
          type: string
          nullable: true
          description: AppsFlyerインテグレーションにおけるネットワークユーザーのID
        branch_id:
          type: string
          nullable: true
          description: BranchインテグレーションにおけるユーザーアプリのBranch Key
        facebook_anonymous_id:
          type: string
          nullable: true
          description: Facebook AdsインテグレーションにおけるユーザーのID
        firebase_app_instance_id:
          type: string
          nullable: true
          description: FirebaseインテグレーションにおけるユーザーのID
        mixpanel_user_id:
          type: string
          nullable: true
          description: MixpanelインテグレーションにおけるユーザーのID
        one_signal_player_id:
          type: string
          nullable: true
          description: OneSignalインテグレーションにおけるユーザーのID（レガシー識別子）
        one_signal_subscription_id:
          type: string
          nullable: true
          description: OneSignalインテグレーションにおけるユーザーのID（推奨識別子）
        posthog_distinct_user_id:
          type: string
          nullable: true
          description: PostHogインテグレーションにおけるユーザーのID
        pushwoosh_hwid:
          type: string
          nullable: true
          description: PushwooshインテグレーションにおけるユーザーデバイスのID
        tenjin_analytics_installation_id:
          type: string
          nullable: true
          description: TenjinインテグレーションにおけるユーザーデバイスのID
    RefundSaverSettingsObject:
      type: object
      description: |
        Refund Saver Settings には、返金リクエストの処理に関するユーザーの設定が含まれます。
        これには、データ共有への同意とカスタム返金設定が含まれます。
      properties:
        consent:
          type: boolean
          description: ユーザーがデータ共有に同意したかどうかを定義します
        custom_preference:
          type: string
          enum:
            - grant
            - grant_prorated
            - no_preference
            - decline
          description: 返金の設定
      required:
        - consent
        - custom_preference
    ErrorObject:
      type: object
      description: |
        エラーはAPIエラーレスポンスを表します。何が問題だったか、
        およびその修正方法に関する情報が含まれています。
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                nullable: true
                description: エラーの原因となったフィールドまたはパラメータ
              errors:
                type: array
                items:
                  type: string
                description: エラーメッセージの配列
            required:
              - errors
          description: エラー詳細の配列
        error_code:
          type: string
          description: 機械可読なエラーコード
        status_code:
          type: integer
          description: HTTPステータスコード
      required:
        - errors
        - error_code
        - status_code
    PaginationObject:
      type: object
      description: |
        リストエンドポイントのページネーションメタデータ。
        現在のページと結果の合計に関する情報を含みます。
      properties:
        count:
          type: integer
          description: アイテムの総数
        page:
          type: integer
          description: 現在のページ番号
        pages:
          type: integer
          description: 総ページ数
      required:
        - count
        - page
        - pages
    VirtualCurrencyTransactionRequest:
      type: object
      description: バーチャル通貨トランザクションを作成するためのリクエストボディ。
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: アトミックに適用する残高調整。各通貨コードは一度のみ指定できます。
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceAdjustment'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            トランザクションとともに保存されるオプションのキーと値のペア。最大5つのキーを指定できます。各キーは `^[a-z0-9_]{1,30}$` に一致し、各値は最大200文字です。
      required:
        - items
    VirtualCurrencyBalanceAdjustment:
      type: object
      properties:
        currency_code:
          type: string
          description: 調整するバーチャル通貨コード。
        amount:
          type: integer
          format: int32
          description: |
            適用する金額。正の値は通貨を付与（クレジット）し、負の値は通貨を消費（デビット）します。ゼロは指定できません。
      required:
        - currency_code
        - amount
    VirtualCurrencyTransactionResponse:
      type: object
      description: バーチャル通貨トランザクションの結果。
      properties:
        transaction_id:
          type: string
          format: uuid
          description: 作成されたトランザクションの一意のID。
        balances:
          type: array
          description: |
            このリクエストによって影響を受けた各通貨のトランザクション後の残高（`items` の各アイテムにつき1エントリ）。プロファイルの残高一覧全体を取得するには、`GET /api/v2/server-side-api/vc/balances/` を使用してください。
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceSnapshot'
      required:
        - transaction_id
        - balances
    VirtualCurrencyBalanceSnapshot:
      type: object
      properties:
        code:
          type: string
          description: 仮想通貨コード。
        name:
          type: string
          description: 仮想通貨の表示名。
        balance:
          type: integer
          format: int32
          minimum: 0
          description: 現在保留中の金額を含む合計残高。
        held:
          type: integer
          format: int32
          minimum: 0
          description: すべてのアクティブな保留（予約済み金額）の合計。現在は常に 0。
        available:
          type: integer
          format: int32
          description: 使用可能な残高。`balance - held` として計算されます。
      required:
        - code
        - name
        - balance
        - held
        - available
    VirtualCurrencyBalanceListResponse:
      type: object
      description: プロファイルのすべてのバーチャル通貨の現在の残高。
      properties:
        response_created_at:
          type: integer
          format: int64
          description: レスポンスが生成された日時（Unixタイムスタンプ、ミリ秒単位）。
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyProfileBalanceItem'
      required:
        - response_created_at
        - data
    VirtualCurrencyProfileBalanceItem:
      type: object
      properties:
        code:
          type: string
          description: アプリ内で一意の仮想通貨コード。ASCII文字、数字、アンダースコアが使用可能です。
        name:
          type: string
          description: 仮想通貨の表示名。
        balance:
          type: integer
          format: int32
          minimum: 0
          description: 現在保留中の金額を含む合計残高。
        held:
          type: integer
          format: int32
          minimum: 0
          description: すべてのアクティブな保留（予約済み金額）の合計。現在は常に0です。
        available:
          type: integer
          format: int32
          description: 支出可能な残高。`balance - held` として算出されます。
      required:
        - code
        - name
        - balance
        - held
        - available
    VirtualCurrencyTransactionsHistoryResponse:
      type: object
      description: プロファイルの仮想通貨トランザクション履歴のページネーションリスト。
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryItem'
        pagination:
          $ref: '#/components/schemas/VirtualCurrencyHistoryPagination'
      required:
        - data
        - pagination
    VirtualCurrencyTransactionsHistoryItem:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
          description: トランザクションの一意のID。
        transaction_type:
          type: string
          description: |
            トランザクションのソース。`store_purchase`、`subscription_renewal`、`trial_start`、`api_transaction`、`dashboard_transaction`、`refund`、または `expiry` のいずれか。
        items:
          type: array
          description: このトランザクションに記録された通貨ごとの残高変動。
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceChange'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: トランザクションに保存されたキーと値のペア（存在する場合）。
        created_at:
          type: string
          format: date-time
          description: トランザクションが記録された日時。
      required:
        - transaction_id
        - transaction_type
        - items
        - created_at
    VirtualCurrencyBalanceChange:
      type: object
      properties:
        currency_code:
          type: string
          description: バーチャル通貨コード。
        amount:
          type: integer
          format: int32
          description: 残高に適用された符号付き変化量。正の値はクレジット、負の値はデビットを表します。
        balance_after:
          type: integer
          format: int32
          minimum: 0
          description: このトランザクション適用後の通貨残高。
      required:
        - currency_code
        - amount
        - balance_after
    VirtualCurrencyHistoryPagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: |
            次のページのための不透明なカーソルです。さらに結果を取得するには、`cursor` クエリパラメータとして渡してください。これ以上ページがない場合は null になります。
      required:
        - next_cursor
