openapi: 3.1.0
info:
  title: Adapty Mail API
  version: 1.0.0
  description: |
    Adapty Mail API を使用すると、Adapty SDK を経由せずに、サーバーから直接ユーザープロファイルとトランザクションイベントを Adapty Mail に送信できます。

    以下の用途に使用します：

    - まだ Adapty Mail にベースがない場合にサブスクライバーを追加する。
    - 他のアプリのサブスクライバーベースを再利用する。
    - バックエンドを信頼できる情報源として、Adapty Mail にサーバー間でデータを送信する。

    メールアドレスを持つプロファイルは **never purchased** フローに十分です。その他のすべてのフロー（renewal cancelled、billing issue、expired、refunded）は購入履歴によって駆動されるため、それらのプロファイルも適切なフローに配置されるためにトランザクションイベントが必要です。

    手順を追ったガイドについては、[Adapty Mail API 経由でメールとトランザクションを送信する](/docs/mail-send-data-via-api) を参照してください。
servers:
  - url: https://api-mail.adapty.io
    description: プロダクションサーバー
paths:
  /api/v1/profile/save/:
    post:
      summary: プロファイルを保存する
      description: |
        Adapty Mail にプロファイルを作成または更新します。プロファイルにはユーザーのメールアドレスと属性が含まれ、
        Adapty Mail はそれを使用して受信者を識別し、[セグメント](/docs/mail-segments)を構築します。

        各ユーザーを一意の `external_profile_id` で識別してください。同じ `external_profile_id` を再度送信すると、
        重複を作成するのではなく、既存のプロファイルが更新されます。
      operationId: saveProfile
      security:
        - apikeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileDTO'
            examples:
              basic:
                summary: メールアドレスを持ち、「未購入」フローに対応したプロファイル
                value:
                  external_profile_id: user_12345
                  external_created_at: '2026-06-01T10:30:00Z'
                  email: jane@example.com
                  country: US
                  custom_attributes:
                    plan: trial
      responses:
        '200':
          description: プロファイルが正常に保存されました。レスポンスボディは空のオブジェクトです。
          content:
            application/json:
              schema:
                type: object
              examples:
                default:
                  value: {}
        '400':
          description: バリデーションに失敗しました — 必須フィールドが欠落しているか無効です。`field_name` に問題のあるフィールドが示されます。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                default:
                  value:
                    errors:
                      - message: Field required
                        error_code: base_error
                        status_code: 400
                        field_name: email
        '403':
          description: シークレット API キーが欠落しているか無効です。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                default:
                  value:
                    errors:
                      - message: Secret key doesn't exist
                        error_code: secret_key_does_not_exist_error
                        status_code: 403
                        field_name: null
  /api/v1/profile/delete/:
    post:
      summary: プロファイルを削除する
      description: |
        プロファイルの個人データを消去し、スケジュールされたメールをキャンセルします。削除権（忘れられる権利）のリクエストを処理するために使用します。

        `external_profile_id`、`customer_user_id`、`email` のいずれかの組み合わせでプロファイルを識別します — Adapty Mail は保存時と同じ方法でプロファイルを解決します。

        消去は最終的なものです。同じ識別子を持つ後続の [プロファイルを保存する](#operation/saveProfile) リクエストはプロファイルを再作成しません。

        `external_profile_id` または `customer_user_id` による削除を繰り返すと、何も変更せずに再度成功します。`email` のみを含む削除を繰り返すと `404` が返されます：消去により保存されたアドレスがクリアされるため、メールアドレスには一致するものが残りません。
      operationId: deleteProfile
      security:
        - apikeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileDeleteDTO'
            examples:
              byExternalProfileId:
                summary: プロファイル保存時に送信した識別子で削除する
                value:
                  external_profile_id: user_12345
              byEmail:
                summary: メールアドレスで削除する
                value:
                  email: jane@example.com
      responses:
        '204':
          description: プロファイルが削除されました。レスポンスのボディはありません。
        '400':
          description: 識別子が提供されませんでした。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                default:
                  value:
                    errors:
                      - message: At least one of external_profile_id, customer_user_id or email must be provided
                        error_code: missing_identifier
                        status_code: 400
                        field_name: null
        '403':
          description: シークレット API キーが存在しないか無効です。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                default:
                  value:
                    errors:
                      - message: Secret key doesn't exist
                        error_code: secret_key_does_not_exist_error
                        status_code: 403
                        field_name: null
        '404':
          description: 送信した識別子に一致するプロファイルがありません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                default:
                  value:
                    errors:
                      - message: Profile not found
                        error_code: profile_not_found_error
                        status_code: 404
                        field_name: null
  /api/v1/profile/transaction-event/save/:
    post:
      summary: トランザクションイベントを保存する
      description: |
        プロファイルのストアトランザクションイベントを記録します。Adapty Mail はトランザクションイベントを使用して、
        プロファイルを購入ベースのフローに配置します。`event_type` は、解約済み、請求の問題、有効期限切れ、返金などのフローに対応します。また、収益のアトリビューションにも使用されます。

        購入、更新、解約を処理する際にこれらのイベントを送信してください。**未購入**フローのみ、イベントなしで機能します。
      operationId: saveTransactionEvent
      security:
        - apikeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionEventDTO'
            examples:
              basic:
                summary: A new monthly subscription purchase
                value:
                  event_type: subscription_started
                  event_id: evt_abc123
                  event_datetime: '2026-06-10T14:20:05Z'
                  external_profile_id: user_12345
                  store: app_store
                  store_product_id: premium_monthly
                  store_transaction_id: '1000000123456789'
                  store_original_transaction_id: '1000000123456789'
                  purchased_at: '2026-06-10T14:20:00Z'
                  originally_purchased_at: '2026-06-10T14:20:00Z'
                  price_usd: '9.99'
                  expires_at: '2026-07-10T14:20:00Z'
      responses:
        '200':
          description: トランザクションイベントが正常に保存されました。レスポンスボディは空のオブジェクトです。
          content:
            application/json:
              schema:
                type: object
              examples:
                default:
                  value: {}
        '400':
          description: バリデーションに失敗しました。必須フィールドが欠落しているか無効です。`field_name` に該当フィールドが示されます。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                default:
                  value:
                    errors:
                      - message: Field required
                        error_code: base_error
                        status_code: 400
                        field_name: event_type
        '403':
          description: シークレット API キーが欠落しているか無効です。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              examples:
                default:
                  value:
                    errors:
                      - message: Secret key doesn't exist
                        error_code: secret_key_does_not_exist_error
                        status_code: 403
                        field_name: null
components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        すべてのリクエストをAdapty Mailのシークレットシークレットキーで認証します。**Authorization**ヘッダーに`Bearer {your_secret_api_key}`の形式（例：`Bearer secret_live_...`）で送信してください。

        このキーはAdapty Mailの**設定**で確認できます。キーはプロジェクト固有であり、データが属するプロジェクトを識別するため、プロファイルおよびトランザクションのエンドポイントにプロジェクトIDは不要です。
  schemas:
    ProfileDTO:
      type: object
      required:
        - external_profile_id
        - external_created_at
        - email
      properties:
        external_profile_id:
          type: string
          description: |
            アプリまたはバックエンドが管理するユーザーの安定した識別子。Adapty Mail がメールアドレス、クリック、購入を1つのプロファイルに紐付けられるよう、リクエスト間で同じ値を使用してください。匿名またはインストールごとの識別子は使用しないでください。
        external_created_at:
          type: string
          format: date-time
          description: |
            ISO 8601 形式のユーザー作成日時（例：`"2026-06-01T10:30:00Z"`）。
            この日付はセグメントで使用できます。
        email:
          type: string
          format: email
          description: |
            ユーザーのメールアドレス。Adapty Mail はこのアドレスにキャンペーンを配信します。

            このアドレスは一度のみ書き込み可能です。プロファイル作成時に設定され、以降の保存では上書きされません。
        customer_user_id:
          type: string
          description: |
            お客様のシステムにおけるユーザー識別子（Adapty も認識している場合）。Adapty Mail はこれを使用して、Adapty SDK 経由でもアクセスする人物を識別します。これにより、同一人物に重複してメールを送信するプロファイルが作成される代わりに、2つのソースが1つのプロファイルを共有します。
        first_name:
          type: string
          description: ユーザーの名。
        last_name:
          type: string
          description: ユーザーの姓。
        gender:
          type: string
          description: ユーザーの性別。
        birthday:
          type: string
          format: date
          description: ISO 8601 形式のユーザーの生年月日（例：`"1990-05-21"`）。
        country:
          type: string
          description: 2文字の大文字 ISO 3166-1 alpha-2 コードで表すユーザーの国（例：`US`）。
        store_country:
          type: string
          description: 2文字の大文字 ISO 3166-1 alpha-2 コードで表すユーザーのストアリージョン（例：`US`）。
        custom_attributes:
          type: object
          description: |
            プロファイルに付加する任意のキーと値のペア（文字列または数値）。これらを使用して[セグメント](/docs/mail-segments)を構築します。例：`plan`、`signup_source`、`trial_days`。
        device_info:
          $ref: '#/components/schemas/DeviceInfoDTO'
    ProfileDeleteDTO:
      type: object
      description: |
        削除するプロファイルの識別子。`external_profile_id`、`customer_user_id`、`email` のいずれか少なくとも1つを送信してください。
      anyOf:
        - required:
            - external_profile_id
        - required:
            - customer_user_id
        - required:
            - email
      properties:
        external_profile_id:
          type: string
          description: プロファイルを保存する際に送信した識別子。
        customer_user_id:
          type: string
          description: お客様自身のシステムにおけるユーザーの識別子。
        email:
          type: string
          format: email
          description: プロファイルに登録されているメールアドレス。
    DeviceInfoDTO:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          description: ユーザーが使用しているプラットフォーム（例：`iOS` または `Android`）。
        device:
          type: string
          description: デバイスのモデル（例：`iPhone15,2`）。
        os:
          type: string
          description: オペレーティングシステムのバージョン（例：`17.5`）。
        locale:
          type: string
          description: ユーザーのロケール（例：`en-US`）。
        timezone:
          type: string
          description: ユーザーのタイムゾーン（例：`America/New_York`）。
        app_version:
          type: string
          description: ユーザーが実行しているアプリのバージョン（例：`3.1.0`）。
    TransactionEventDTO:
      type: object
      required:
        - event_type
        - event_id
        - event_datetime
        - external_profile_id
        - store
        - store_product_id
        - store_transaction_id
        - store_original_transaction_id
        - purchased_at
        - originally_purchased_at
      properties:
        event_type:
          $ref: '#/components/schemas/TransactionEventType'
        event_id:
          type: string
          description: このイベントの一意の識別子。あなたのシステムが所有します。イベントのべき等性を保つために使用してください。
        event_datetime:
          type: string
          format: date-time
          description: イベントが記録された日時（ISO 8601 形式）。
        external_profile_id:
          type: string
          description: |
            プロファイルを保存する際に送信するのと同じ安定した `external_profile_id`。トランザクションを
            正しいプロファイルに紐付けます。

            プロファイルが存在する前にトランザクションを送信することもできます。Adapty Mail はイベントを
            未紐付けの状態で保存し、同じ識別子を持つ次の保存時にプロファイルへ紐付けます。
        customer_user_id:
          type: string
          description: |
            あなた自身のシステムにおけるユーザーの識別子。`external_profile_id` が一致しない場合に、
            Adapty Mail がプロファイルを見つけるために使用します。イベントには保存されません。
        email:
          type: string
          format: email
          description: |
            購入者のメールアドレス。どちらの識別子も一致しない場合に、Adapty Mail がプロファイルを
            見つけるために使用します。イベントには保存されません。
        store:
          type: string
          description: トランザクションの発生元ストア。例：`app_store`、`play_store`、または `stripe`。
        store_product_id:
          type: string
          description: ストアにおける購入済みプロダクトの識別子。
        store_transaction_id:
          type: string
          description: ストアにおけるこのトランザクションの識別子。
        store_original_transaction_id:
          type: string
          description: サブスクリプションチェーンにおける最初のトランザクションの識別子。初回購入の場合は `store_transaction_id` と同じ値になります。
        purchased_at:
          type: string
          format: date-time
          description: このトランザクションが発生した日時（ISO 8601 形式）。
        originally_purchased_at:
          type: string
          format: date-time
          description: サブスクリプションが最初に購入された日時（ISO 8601 形式）。
        price_usd:
          type: string
          description: トランザクション金額（USD）。10進数の文字列形式（例：`"9.99"`）。
        expires_at:
          type: string
          format: date-time
          description: サブスクリプションの有効期限（ISO 8601 形式）。サブスクリプション以外の購入の場合は省略してください。
        offer:
          $ref: '#/components/schemas/Offer'
    TransactionEventType:
      type: string
      description: トランザクションイベントの種類。購入ベースのフローはこれらの値によってトリガーされます。
      enum:
        - subscription_started
        - subscription_renewed
        - subscription_renewal_cancelled
        - subscription_renewal_reactivated
        - billing_issue_detected
        - entered_grace_period
        - subscription_refunded
        - subscription_expired
        - non_subscription_purchase
        - non_subscription_purchase_refunded
    Offer:
      type: object
      description: トランザクションに適用されたプロモーションオファーまたは初回オファーの詳細。
      required:
        - category
        - offer_type
      properties:
        category:
          $ref: '#/components/schemas/OfferCategory'
        offer_type:
          $ref: '#/components/schemas/OfferType'
        offer_id:
          type: string
          description: ストア内のオファーの識別子（存在する場合）。
    OfferCategory:
      type: string
      enum:
        - introductory
        - promotional
        - offer_code
        - win_back
    OfferType:
      type: string
      enum:
        - free_trial
        - pay_as_you_go
        - pay_up_front
    Errors:
      type: object
      description: 標準エラーレスポンス。すべての失敗は、この形式で 4XX ステータスを返します。
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: エラーの人間が読める説明。
              error_code:
                type: string
                description: 機械可読なエラー識別子。
              status_code:
                type: integer
                description: このエラーの HTTP ステータスコード。
              field_name:
                type: string
                description: エラーの原因となったリクエストフィールド。エラーがフィールド固有でない場合は `null`。
