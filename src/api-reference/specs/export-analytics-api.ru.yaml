          description: Дополнительные вложенные значения для данного этапа воронки
          items:
            type: object
    LTVDataResponse:
      type: object
      description: Ответ, содержащий данные о пожизненной ценности (LTV) для различных типов выручки
      properties:
        revenue:
          $ref: '#/components/schemas/LTVMetric'
          description: LTV, рассчитанный на основе валовой выручки
        proceeds:
          $ref: '#/components/schemas/LTVMetric'
          description: LTV, рассчитанный на основе поступлений (после вычета комиссии стора)
        net_revenue:
          $ref: '#/components/schemas/LTVMetric'
          description: LTV, рассчитанный на основе чистой выручки
    LTVMetric:
      type: object
      description: Отдельная метрика LTV, содержащая данные когорты и расчёты
      properties:
        data:
          type: array
          description: Массив точек данных LTV для различных когорт
          items:
            $ref: '#/components/schemas/LTVData'
        description:
          type: string
          description: HTML-описание, объясняющее способ расчёта LTV
        value:
          type: number
          description: Общее значение LTV
        unit:
          type: string
          description: Единица измерения (как правило, «USD»)
        title:
          type: string
          description: Отображаемый заголовок данной метрики LTV
    LTVData:
      type: object
      description: Отдельная точка данных LTV для конкретной когорты
      properties:
        title:
          type: string
          description: Отображаемый заголовок для данной точки данных LTV
        type:
          type: string
          description: Тип данных LTV ('total' для агрегированных данных)
        value:
          type: number
          description: Значение LTV для данной когорты
        values:
          type: array
          description: Массив значений LTV по периодам
          items:
            type: object
        cohort_size:
          type: integer
          description: Количество пользователей в данной когорте
    RetentionDataResponse:
      type: object
      description: Ответ, содержащий данные об удержании пользователей с течением времени
      properties:
        data:
          type: array
          description: Массив точек данных об удержании (может быть пустым для некоторых типов удержания)
          items:
            type: object
        title:
          type: string
          description: Отображаемое название метрики удержания
        metric_name:
          type: string
          description: Внутреннее название метрики удержания
        description:
          type: string
          description: Пояснение способа расчёта удержания (абсолютные или относительные значения)
        value_type:
          type: string
          nullable: true
          description: Тип значения удержания (абсолютное или относительное)
security:
  - apikeyAuth: []
