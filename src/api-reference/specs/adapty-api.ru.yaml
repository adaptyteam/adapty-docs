        app_version:
          type: string
          nullable: true
          description: Версия приложения
        adapty_sdk_version:
          type: string
          nullable: true
          description: Версия SDK Adapty
        idfa:
          type: string
          nullable: true
          description: iOS Identifier for Advertisers
        idfv:
          type: string
          nullable: true
          description: iOS Identifier for Vendor
        advertising_id:
          type: string
          nullable: true
          description: Идентификатор рекламы Android
        android_id:
          type: string
          nullable: true
