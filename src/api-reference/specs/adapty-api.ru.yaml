components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      name: Authorization
      in: header
      default: Api-Key {Your secret API key}
      description: |
        API-запросы должны быть аутентифицированы с помощью вашего секретного API-ключа, передаваемого в заголовке **Authorization** со значением `Api-Key {your_secret_api_key}`, например `Api-Key secret_live_...`. Найдите этот ключ в дашборде Adapty -> **App Settings** -> вкладка **General** -> раздел **API keys**.
  requestBodies:
    DefaultJson:
      required: true
      content:
        application/json:
          schema:
            type: object
  schemas:
    ProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          description: Имя вашего конечного пользователя
        last_name:
          type: string
          nullable: true
          description: Фамилия вашего конечного пользователя
        gender:
          type: string
          nullable: true
          enum:
            - f
            - m
            - o
          description: Пол вашего конечного пользователя
        email:
          type: string
          nullable: true
          format: email
          description: Электронная почта вашего конечного пользователя
        phone_number:
          type: string
          nullable: true
          description: Номер телефона вашего конечного пользователя
        birthday:
          type: string
          format: date
          nullable: true
          description: Дата рождения вашего конечного пользователя
        ip_country:
          type: string
          nullable: true
          description: Страна конечного пользователя в виде двухбуквенного кода ISO 3166-1 alpha-2, например `FR`
        ip_v4_address:
          type: string
          nullable: true
          description: IPv4-адрес конечного пользователя
        store_country:
          type: string
          nullable: true
          description: Страна стора конечного пользователя в виде двухбуквенного кода ISO 3166-1 alpha-2, например `US`
        store:
          type: string
          nullable: true
          enum:
            - app_store
            - play_store
            - stripe
            - adapty
            - paddle
          description: Платформа, которую пользователь использует для совершения покупок в вашем приложении
        store_account_token:
          type: string
          format: uuid
          nullable: true
          description: Токен аккаунта стора
        att_status:
          type: integer
          nullable: true
          enum:
            - 0
            - 1
            - 2
            - 3
          description: Статус Apple App Tracking Transparency (0=не определено, 1=ограничено, 2=отклонено, 3=авторизовано)
        analytics_disabled:
          type: boolean
          nullable: true
          description: Опция отказа от внешней аналитики
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: Позволяет задать до 30 пользовательских атрибутов для профиля
        installation_meta:
          $ref: '#/components/schemas/InstallationMeta'
      required:
        - installation_meta
      example:
        first_name: Jane
        last_name: Doe
        gender: f
        email: jane.doe@example.com
        phone_number: '+1234567890'
        birthday: '2000-12-31'
        ip_country: FR
        ip_v4_address: 192.168.1.1
        store_country: US
        store: app_store
        store_account_token: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        att_status: 3
        analytics_disabled: true
        custom_attributes:
          - key: favourite_sport
            value: yoga
        installation_meta:
          device_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          device: iPhone 15 Pro
          locale: en
          os: iOS 17.1
          platform: iOS
          timezone: Europe/Rome
          user_agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_1_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1
          app_build: 1.0.0
          app_version: 1.0.0
          adapty_sdk_version: 2.0.0
          idfa: EA7583CD-A667-48BC-B806-42ECB2B48333
          idfv: E9D48DA5-3930-4B41-8521-D953AECD2F33
          advertising_id: ''
          android_id: ''
          android_app_set_id: ''
    ProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Profile'
      required:
        - data
    Profile:
      type: object
      properties:
        app_id:
          type: string
          format: uuid
          description: Внутренний ID вашего приложения
        profile_id:
          type: string
          format: uuid
          description: ID профиля Adapty
        customer_user_id:
          type: string
          nullable: true
          description: ID вашего пользователя в вашей системе
        total_revenue_usd:
          type: number
          format: float
          description: Числовое значение с плавающей точкой, представляющее общий доход в USD, полученный по профилю
        segment_hash:
          type: string
          description: Внутренний параметр
        timestamp:
          type: integer
          format: int64
          description: Время ответа в миллисекундах, необходимо для разрешения состояния гонки
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: Для профиля допускается задавать не более 30 пользовательских атрибутов
        access_levels:
          type: array
          items:
            $ref: '#/components/schemas/AccessLevel'
          description: Массив объектов уровня доступа. Пустой массив, если у пользователя нет уровней доступа
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
          description: Массив объектов подписки. Пустой массив, если у пользователя нет подписок
        non_subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/NonSubscription'
          description: Массив объектов разовых покупок. Пустой массив, если у пользователя нет покупок
      required:
        - app_id
        - profile_id
        - customer_user_id
        - total_revenue_usd
        - segment_hash
        - timestamp
        - custom_attributes
        - access_levels
        - subscriptions
        - non_subscriptions
    CustomAttribute:
      type: object
      properties:
        key:
          type: string
          maxLength: 30
          description: Ключ должен быть строкой не более 30 символов. Допускаются только буквы, цифры, дефисы, точки и символы подчёркивания
        value:
          oneOf:
            - type: string
            - type: number
          description: Значение атрибута должно содержать не более 50 символов. В качестве значений допускаются только строки и числа с плавающей точкой
      required:
        - key
        - value
    InstallationMeta:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: Уникальный идентификатор устройства
        device:
          type: string
          nullable: true
          description: Информация об устройстве
        locale:
          type: string
          nullable: true
          description: Локаль устройства
        os:
          type: string
          nullable: true
          description: Информация об операционной системе
        platform:
