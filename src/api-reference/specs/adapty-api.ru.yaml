          description: Название продукта
        product_set:
          type: string
          description: Категория набора продуктов
        offer:
          type: object
          nullable: true
          properties:
            product_offer_id:
              type: string
              format: uuid
              description: Уникальный идентификатор предложения продукта
            title:
              type: string
              description: Название предложения
          required:
            - product_offer_id
            - title
          description: Информация о предложении продукта
      required:
        - product_id
        - title
