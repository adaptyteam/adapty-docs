        store_product_id:
          type: string
          description: Идентификатор продукта в сторе
        store_base_plan_id:
          type: string
          nullable: true
          description: Идентификатор базового плана в сторе
        store_transaction_id:
          type: string
          description: Идентификатор транзакции в сторе
        store_original_transaction_id:
          type: string
          description: Идентификатор исходной транзакции в сторе
        offer:
          allOf:
            - $ref: '#/components/schemas/OfferDTO'
          nullable: true
          description: Детали предложения, если был применён promotional offer или introductory offer
        starts_at:
          type: string
