          description: Tableau des détails d'erreur
        error_code:
          type: string
          description: Un code d'erreur lisible par une machine
        status_code:
          type: integer
          description: Le code de statut HTTP
      required:
        - errors
        - error_code
        - status_code

    PaginationObject:
      type: object
      description: |
        Métadonnées de pagination pour les points de terminaison de liste. Contient des informations sur 
        la page actuelle et le total des résultats.
      properties:
        count:
          type: integer
          description: Nombre total d'éléments
        page:
          type: integer
          description: Numéro de page actuel
        pages:
          type: integer
          description: Nombre total de pages
      required:
        - count
        - page
        - pages

    VirtualCurrencyTransactionRequest:
      type: object
      description: Corps de la requête pour créer une transaction de monnaie virtuelle.
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: Ajustements de solde à appliquer de manière atomique. Chaque code de monnaie ne peut apparaître qu'une seule fois.
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceAdjustment'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            Paires clé-valeur optionnelles stockées avec la transaction. Maximum 5 clés. Chaque clé correspond à `^[a-z0-9_]{1,30}$`, et chaque valeur comporte au plus 200 caractères.
      required:
        - items

    VirtualCurrencyBalanceAdjustment:
      type: object
      properties:
        currency_code:
          type: string
          description: Le code de la monnaie virtuelle à ajuster.
        amount:
          type: integer
          format: int32
          description: |
            Le montant à appliquer. Une valeur positive crédite (accorde) la monnaie ; une valeur négative la débite (dépense). Ne peut pas être nul.
      required:
        - currency_code
        - amount

    VirtualCurrencyTransactionResponse:
      type: object
      description: Résultat d'une transaction de monnaie virtuelle.
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Identifiant unique de la transaction créée.
        balances:
          type: array
          description: |
            Solde après transaction pour chaque monnaie affectée par cette requête (une entrée par élément dans `items`). Pour consulter la liste complète des soldes du profil, utilisez `GET /api/v2/server-side-api/vc/balances/`.
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceSnapshot'
      required:
        - transaction_id
        - balances

    VirtualCurrencyBalanceSnapshot:
      type: object
      properties:
        code:
          type: string
          description: Code de la monnaie virtuelle.
        name:
          type: string
          description: Nom d'affichage de la monnaie virtuelle.
        balance:
          type: integer
          format: int32
          minimum: 0
          description: Solde total, y compris les montants actuellement retenus.
        held:
          type: integer
          format: int32
          minimum: 0
          description: Somme de toutes les retenues actives (montants réservés). Actuellement toujours 0.
        available:
          type: integer
          format: int32
          description: Solde disponible à dépenser, calculé comme `balance - held`.
      required:
        - code
        - name
        - balance
        - held
        - available

    VirtualCurrencyBalanceListResponse:
      type: object
      description: Soldes actuels de toutes les monnaies virtuelles d'un profil.
      properties:
        response_created_at:
          type: integer
          format: int64
          description: Moment auquel la réponse a été générée, sous forme d'horodatage Unix en millisecondes.
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyProfileBalanceItem'
      required:
        - response_created_at
        - data

    VirtualCurrencyProfileBalanceItem:
      type: object
      properties:
        code:
          type: string
          description: Code unique de la monnaie virtuelle dans l'application. Lettres ASCII, chiffres et underscore.
        name:
          type: string
          description: Nom d'affichage de la monnaie virtuelle.
        balance:
          type: integer
          format: int32
          minimum: 0
          description: Solde total, y compris les montants actuellement retenus.
        held:
          type: integer
          format: int32
          minimum: 0
          description: Somme de toutes les retenues actives (montants réservés). Actuellement toujours 0.
        available:
          type: integer
          format: int32
          description: Solde disponible à dépenser, calculé comme `balance - held`.
      required:
        - code
        - name
        - balance
        - held
        - available

    VirtualCurrencyTransactionsHistoryResponse:
      type: object
      description: Liste paginée des transactions de monnaies virtuelles pour un profil.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryItem'
        pagination:
          $ref: '#/components/schemas/VirtualCurrencyHistoryPagination'
      required:
        - data
        - pagination

    VirtualCurrencyTransactionsHistoryItem:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Identifiant unique de la transaction.
        transaction_type:
          type: string
          description: |
            La source de la transaction. L'une des valeurs suivantes : `store_purchase`, `subscription_renewal`, `trial_start`, `api_transaction`, `dashboard_transaction`, `refund`, ou `expiry`.
        items:
          type: array
          description: Variations de solde par monnaie enregistrées dans cette transaction.
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceChange'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Paires clé-valeur stockées avec la transaction, le cas échéant.
        created_at:
          type: string
          format: date-time
          description: Quand la transaction a été enregistrée.
      required:
        - transaction_id
        - transaction_type
        - items
        - created_at

    VirtualCurrencyBalanceChange:
      type: object
      properties:
        currency_code:
          type: string
          description: Le code de la monnaie virtuelle.
        amount:
          type: integer
          format: int32
          description: La variation signée appliquée au solde. Une valeur positive est un crédit, une valeur négative est un débit.
        balance_after:
          type: integer
          format: int32
          minimum: 0
          description: Le solde de la monnaie après l'application de cette transaction.
      required:
        - currency_code
        - amount
        - balance_after

    VirtualCurrencyHistoryPagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: |
            Curseur opaque pour la page suivante. Transmettez-le en tant que paramètre de requête `cursor` pour récupérer d'autres résultats. Null lorsqu'il n'y a plus de pages.
      required:
        - next_cursor