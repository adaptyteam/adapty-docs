  /api/v2/server-side-api/vc/transactions/:
    post:
      summary: Créer une transaction de monnaie virtuelle
      description: |
        Crédite ou débite une ou plusieurs monnaies virtuelles pour un profil en une seule transaction atomique. Utilisez un `amount` positif pour créditer (accorder) et un `amount` négatif pour débiter (dépenser). Tous les éléments sont appliqués ensemble — si l'un échoue, aucun n'est appliqué.

        Chaque code de monnaie ne peut apparaître qu'une seule fois par requête. Un crédit via ce point de terminaison crée toujours un solde sans expiration.
      operationId: createVirtualCurrencyTransaction
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: L'identifiant unique du client dans votre système. `adapty-customer-user-id` ou `adapty-profile-id` est requis.
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: L'identifiant unique du profil dans votre système. Meilleure option si vous travaillez avec des profils anonymes. `adapty-customer-user-id` ou `adapty-profile-id` est requis.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Un UUID v4 qui rend la requête idempotente. Si vous relancez une requête avec la même clé, Adapty renvoie le résultat de la transaction originale sans modifier à nouveau les soldes. Doit être un UUID v4 valide.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualCurrencyTransactionRequest'
            examples:
              debit:
                summary: Dépenser (débiter) une monnaie
                value:
                  items:
                    - currency_code: "COINS"
                      amount: -10
              credit:
                summary: Accorder (créditer) une monnaie
                value:
                  items:
                    - currency_code: "COINS"
                      amount: 500
              multi_currency:
                summary: Débiter deux monnaies simultanément
                value:
                  items:
                    - currency_code: "GOLD"
                      amount: -50
                    - currency_code: "SILVER"
                      amount: -200
              conversion:
                summary: Convertir une monnaie en une autre
                value:
                  items:
                    - currency_code: "SILVER"
                      amount: -100
                    - currency_code: "GOLD"
                      amount: 10
                  metadata:
                    reason: "exchange"
      responses:
        '200':
          description: Transaction appliquée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionResponse'
              example:
                transaction_id: "0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90"
                balances:
                  - code: "COINS"
                    name: "Gold Coins"
                    balance: 12950
                    held: 0
                    available: 12950
        '400':
          description: |
            Requête incorrecte. Le champ `error_code` identifie la cause : `insufficient_balance`, `unknown_currency`, `duplicate_currency`, `amount_zero`, `balance_overflow`, `empty_items`, ou `idempotency_key_invalid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: "currency_code"
                    errors: ["Insufficient balance for currency COINS"]
                error_code: "insufficient_balance"
                status_code: 400
        '401':
          description: Non autorisé. La clé API est manquante ou invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Interdit. L'API serveur pour les monnaies virtuelles n'est pas activée pour cette application. Contactez le support Adapty pour en demander l'accès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors: ["Server API for virtual currencies is not enabled for this app. Contact Adapty support to request access."]
                error_code: "feature_not_enabled"
                status_code: 403
        '404':
          description: Profil introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Conflit. Le champ `error_code` identifie la cause :

            - `idempotency_in_flight` — une requête avec la même `Idempotency-Key` est toujours en cours de traitement. Réessayez après l'intervalle indiqué dans l'en-tête de réponse `Retry-After`.
            - `duplicate_source_transaction` — la transaction du store sous-jacente a déjà été créditée, elle n'est donc pas appliquée à nouveau.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors: ["A similar request is being processed."]
                error_code: "idempotency_in_flight"
                status_code: 409
        '422':
          description: |
            Entité non traitable. Le corps de la requête n'a pas passé la validation du schéma — par exemple, `items` contient plus de 20 entrées, ou une clé ou valeur de `metadata` ne respecte pas ses contraintes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Trop de requêtes. La limite de débit par application ou globale a été dépassée (`error_code` est `rate_limited`). Les limites par défaut sont 600 requêtes par minute par application et 6 000 requêtes par minute globalement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur
    get:
      summary: Lister les transactions de monnaie virtuelle
      description: |
        Renvoie l'historique des transactions de monnaie virtuelle pour un profil, de la plus récente à la plus ancienne. Les résultats utilisent la pagination par curseur : lorsque la réponse inclut un `pagination.next_cursor` non nul, transmettez-le en tant que paramètre de requête `cursor` pour récupérer la page suivante.
      operationId: listVirtualCurrencyTransactions
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: L'identifiant unique du client dans votre système. `adapty-customer-user-id` ou `adapty-profile-id` est requis.
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: L'identifiant unique du profil dans votre système. Meilleure option si vous travaillez avec des profils anonymes. `adapty-customer-user-id` ou `adapty-profile-id` est requis.
        - name: currency_code
          in: query
          required: false
          schema:
            type: string
          description: Filtrer l'historique sur un seul code de monnaie virtuelle.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Curseur de pagination opaque renvoyé en tant que `pagination.next_cursor` dans une réponse précédente. Omettez ce paramètre pour récupérer la première page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Nombre maximum de transactions à retourner par page. Par défaut 50.
      responses:
        '200':
          description: Historique des transactions retourné avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryResponse'
              example:
                data:
                  - transaction_id: "0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90"
                    transaction_type: "api_transaction"
                    items:
                      - currency_code: "COINS"
                        amount: 500
                        balance_after: 12950
                    metadata:
                      reason: "promo_bonus"
                    created_at: "2026-05-23T10:30:00Z"
                  - transaction_id: "0190e7b2-9a44-7c10-bb31-7d2e9f0a1c55"
                    transaction_type: "store_purchase"
                    items:
                      - currency_code: "COINS"
                        amount: 1000
                        balance_after: 12450
                    created_at: "2026-05-22T18:05:12Z"
                  - transaction_id: "0190e5c0-3f18-7b9a-9e6d-44a1c8b27e03"
                    transaction_type: "subscription_renewal"
                    items:
                      - currency_code: "GEMS"
                        amount: 200
                        balance_after: 3280
                    created_at: "2026-05-20T09:00:00Z"
                pagination:
                  next_cursor: "MjAyNi0wNS0yMFQwOTowMDowMFowMTkwZTVjMC0zZjE4LTdiOWEtOWU2ZC00NGExYzhiMjdlMDM="
        '400':
          description: Requête incorrecte. La valeur du `cursor` est invalide (`error_code` est `invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autorisé. La clé API est manquante ou invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Interdit. L'API serveur pour les monnaies virtuelles n'est pas activée pour cette application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profil introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur

  /api/v2/server-side-api/vc/balances/:
    get:
      summary: Lister les soldes de monnaies virtuelles
      description: |
        Renvoie le solde actuel de chaque monnaie virtuelle pour un profil. Si l'application n'a pas de monnaies virtuelles, `data` est un tableau vide.
      operationId: listVirtualCurrencyBalances
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: L'identifiant unique du client dans votre système. `adapty-customer-user-id` ou `adapty-profile-id` est requis.
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: L'identifiant unique du profil dans votre système. Meilleure option si vous travaillez avec des profils anonymes. `adapty-customer-user-id` ou `adapty-profile-id` est requis.
      responses:
        '200':
          description: Soldes retournés avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyBalanceListResponse'
              example:
                response_created_at: 1779791400000
                data:
                  - code: "COINS"
                    name: "Gold Coins"
                    balance: 12450
                    held: 0
                    available: 12450
                  - code: "GEMS"
                    name: "Gems"
                    balance: 3280
                    held: 0
                    available: 3280
                  - code: "ENERGY"
                    name: "Energy"
                    balance: 840
                    held: 0
                    available: 840
        '400':
          description: Requête incorrecte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autorisé. La clé API est manquante ou invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Interdit. L'API serveur pour les monnaies virtuelles n'est pas activée pour cette application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profil introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur

components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      name: Authorization
      in: header
      default: Api-Key {Your secret API key}
      description: |
        Les requêtes API doivent être authentifiées par votre clé API secrète via l'en-tête **Authorization** 
        avec la valeur `Api-Key {your_secret_api_key}`, par exemple, 
        `Api-Key secret_live_...`. Retrouvez cette clé dans l'Adapty Dashboard -> 
        **App Settings** -> onglet **General** -> section **API keys**.
  requestBodies:
    DefaultJson:
      required: true
      content:
        application/json:
          schema:
            type: object
  schemas:
    ProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          description: Prénom de votre utilisateur final
        last_name:
          type: string
          nullable: true
          description: Nom de famille de votre utilisateur final
        gender:
          type: string
          nullable: true
          enum: [f, m, o]
          description: Genre de votre utilisateur final
        email:
          type: string
          nullable: true
          format: email
          description: Adresse e-mail de votre utilisateur final
        phone_number:
          type: string
          nullable: true
          description: Numéro de téléphone de votre utilisateur final
        birthday:
          type: string
          format: date
          nullable: true
          description: Date de naissance de votre utilisateur final
        ip_country:
          type: string
          nullable: true
          description: Pays de l'utilisateur final au format ISO 3166-2
        ip_v4_address:
          type: string
          nullable: true
          description: Adresse IPv4 de l'utilisateur final
        store_country:
          type: string
          nullable: true
          description: Pays du store de l'utilisateur final
        store:
          type: string
          nullable: true
          enum: [app_store, play_store, stripe, adapty, paddle]
          description: La plateforme utilisée par l'utilisateur pour effectuer des achats dans votre application
        store_account_token:
          type: string
          format: uuid
          nullable: true
          description: Jeton de compte du store
        att_status:
          type: integer
          nullable: true
          enum: [0, 1, 2, 3]
          description: Statut Apple App Tracking Transparency (0=non déterminé, 1=restreint, 2=refusé, 3=autorisé)
        analytics_disabled:
          type: boolean
          nullable: true
          description: Option pour se désinscrire des analyses externes
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: Permet de définir jusqu'à 30 attributs personnalisés pour le profil
        installation_meta:
          $ref: '#/components/schemas/InstallationMeta'
      required:
        - installation_meta
      example:
        first_name: "Jane"
        last_name: "Doe"
        gender: "f"
        email: "jane.doe@example.com"
        phone_number: "+1234567890"
        birthday: "2000-12-31"
        ip_country: "FR"
        ip_v4_address: "192.168.1.1"
        store_country: "US"
        store: "app_store"
        store_account_token: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        att_status: 3
        analytics_disabled: true
        custom_attributes:
          - key: "favourite_sport"
            value: "yoga"
        installation_meta:
          device_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          device: "iPhone 15 Pro"
          locale: "en"
          os: "iOS 17.1"
          platform: "iOS"
          timezone: "Europe/Rome"
          user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_1_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1"
          app_build: "1.0.0"
          app_version: "1.0.0"
          adapty_sdk_version: "2.0.0"
          idfa: "EA7583CD-A667-48BC-B806-42ECB2B48333"
          idfv: "E9D48DA5-3930-4B41-8521-D953AECD2F33"
          advertising_id: ""
          android_id: ""
          android_app_set_id: ""

    ProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Profile'
      required:
        - data

    Profile:
      type: object
      properties:
        app_id:
          type: string
          format: uuid
          description: L'identifiant interne de votre application
        profile_id:
          type: string
          format: uuid
          description: Identifiant de profil Adapty
        customer_user_id:
          type: string
          nullable: true
          description: L'identifiant de votre utilisateur dans votre système
        total_revenue_usd:
          type: number
          format: float
          description: Valeur décimale représentant le chiffre d'affaires total en USD généré par le profil
        segment_hash:
          type: string
          description: Paramètre interne
        timestamp:
          type: integer
          format: int64
          description: Temps de réponse en millisecondes, nécessaire pour résoudre une condition de concurrence
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: Maximum de 30 attributs personnalisés autorisés pour le profil
        access_levels:
          type: array
          items:
            $ref: '#/components/schemas/AccessLevel'
          description: Tableau d'objets de niveau d'accès. Tableau vide si le client n'a aucun niveau d'accès
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
          description: Tableau d'objets d'abonnement. Tableau vide si le client n'a aucun abonnement
        non_subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/NonSubscription'
          description: Tableau d'objets hors abonnement. Tableau vide si le client n'a aucun achat
      required:
        - app_id
        - profile_id
        - customer_user_id
        - total_revenue_usd
        - segment_hash
        - timestamp
        - custom_attributes
        - access_levels
        - subscriptions
        - non_subscriptions

    CustomAttribute:
      type: object
      properties:
        key:
          type: string
          maxLength: 30
          description: La clé doit être une chaîne de caractères d'au plus 30 caractères. Seuls les lettres, chiffres, tirets, points et underscores sont autorisés
        value:
          oneOf:
            - type: string
            - type: number
          description: La valeur de l'attribut doit comporter au plus 50 caractères. Seules les chaînes de caractères et les décimaux sont autorisés comme valeurs
      required:
        - key
        - value

    InstallationMeta:
      type: object
      properties:
        device_id:
          type: string
