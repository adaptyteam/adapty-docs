          description: Identifiant unique de l'appareil
        device:
          type: string
          nullable: true
          description: Informations sur l'appareil
        locale:
          type: string
          nullable: true
          description: Langue de l'appareil
        os:
          type: string
          nullable: true
          description: Informations sur le système d'exploitation
        platform:
          type: string
          nullable: true
