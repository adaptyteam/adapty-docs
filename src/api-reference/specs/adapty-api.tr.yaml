                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Yetkisiz. API anahtarı eksik veya geçersiz.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
