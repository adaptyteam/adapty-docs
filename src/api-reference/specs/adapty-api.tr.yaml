        '500':
          description: Sunucu içi hata
components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      name: Authorization
      in: header
      default: Api-Key {Your secret API key}
      description: |
        API istekleri, gizli API anahtarınız tarafından **Authorization** başlığı olarak
        `Api-Key {your_secret_api_key}` değeriyle doğrulanmalıdır; örneğin,
        `Api-Key secret_live_...`. Bu anahtarı Adapty Kontrol Paneli ->
        **Uygulama Ayarları** -> **Genel** sekmesi -> **API anahtarları** bölümünde bulabilirsiniz.
  requestBodies:
    DefaultJson:
      required: true
      content:
        application/json:
          schema:
            type: object
  schemas:
    ProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          description: Son kullanıcınızın adı
        last_name:
          type: string
          nullable: true
          description: Son kullanıcınızın soyadı
        gender:
          type: string
          nullable: true
          enum:
            - f
            - m
            - o
          description: Son kullanıcınızın cinsiyeti
        email:
          type: string
          nullable: true
          format: email
          description: Son kullanıcınızın e-posta adresi
        phone_number:
          type: string
          nullable: true
          description: Son kullanıcınızın telefon numarası
        birthday:
          type: string
          format: date
          nullable: true
          description: Son kullanıcınızın doğum tarihi
        ip_country:
          type: string
          nullable: true
          description: Son kullanıcının ISO 3166-2 formatında ülkesi
        ip_v4_address:
          type: string
          nullable: true
          description: Son kullanıcının IPv4 adresi
        store_country:
          type: string
          nullable: true
          description: Son kullanıcının uygulama mağazasının bulunduğu ülke
        store:
          type: string
          nullable: true
          enum:
            - app_store
            - play_store
            - stripe
            - adapty
            - paddle
          description: Kullanıcının uygulamanızda satın alma yapmak için kullandığı platform
        store_account_token:
          type: string
          format: uuid
          nullable: true
          description: Mağaza hesap token'ı
        att_status:
          type: integer
          nullable: true
          enum:
            - 0
            - 1
            - 2
            - 3
          description: Apple App Tracking Transparency durumu (0=belirlenmedi, 1=kısıtlandı, 2=reddedildi, 3=yetkilendirildi)
        analytics_disabled:
          type: boolean
          nullable: true
          description: Harici analizden çıkmak için seçenek
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: profil için 30'a kadar özel öznitelik ayarlamaya olanak tanır
        installation_meta:
          $ref: '#/components/schemas/InstallationMeta'
      required:
