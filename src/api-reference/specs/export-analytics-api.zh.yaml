            type: object
        title:
          type: string
          description: 留存数据图表的显示标题
        metric_name:
          type: string
          description: 留存数据图表的内部名称
        description:
          type: string
          description: 留存计算方式的说明（绝对值与相对值）
        value_type:
          type: string
          nullable: true
          description: 留存值的类型（绝对值或相对值）
