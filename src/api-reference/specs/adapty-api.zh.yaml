          default: Production
          description: 发生购买的环境
        store_product_id:
          type: string
          description: 商店中的产品 ID
        store_transaction_id:
          type: string
          maxLength: 50
          description: 商店中的交易 ID。最多 50 个字符。PayPal 及某些自定义商店的交易 ID 可能超过此限制——请在提交前对值进行截断或哈希处理，否则请求将失败。
        store_original_transaction_id:
          type: string
          description: 商店中的原始交易 ID
        is_family_shared:
          type: boolean
          default: false
          description: 该购买是否为家庭共享
        price:
          $ref: '#/components/schemas/PriceDTO'
        purchased_at:
          type: string
          format: date-time
          description: 购买发生的时间
        variation_id:
          type: string
          nullable: true
          description: 用于 A/B 测试的实验变体 ID
        offer:
          $ref: '#/components/schemas/OfferDTO'
          nullable: true
        refunded_at:
          type: string
          format: date-time
          nullable: true
          description: 退款发生的时间
        cancellation_reason:
          type: string
          enum:
            - billing_error
            - cancelled_by_developer
