      type: object
      properties:
        custom_preference:
          type: string
          enum:
            - grant
            - grant_prorated
            - no_preference
            - decline
          nullable: true
          description: |
            为该用户单独设置退款偏好。
            - `grant`：批准每笔退款请求
            - `grant_prorated`：按用户尚未消费的购买比例批准退款
            - `no_preference`：不提供任何建议
            - `decline`：拒绝每笔退款请求
        consent:
          type: boolean
          nullable: true
          description: |
            记录用户是否同意共享其数据。
            - `true` 表示如果您收到应用内退款请求，可向 Apple 提供该用户的相关信息
      example:
