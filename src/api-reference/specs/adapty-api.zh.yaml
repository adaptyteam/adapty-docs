                    available: 3280
                  - code: ENERGY
                    name: Energy
                    balance: 840
                    held: 0
                    available: 840
        '400':
          description: 请求错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未授权。API 密钥缺失或无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 禁止访问。此应用未启用虚拟货币服务端 API。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 用户画像未找到。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      name: Authorization
      in: header
      default: Api-Key {Your secret API key}
      description: |
        API 请求必须通过您的密钥进行身份验证，将其作为 **Authorization** 请求头，
        值为 `Api-Key {your_secret_api_key}`，例如 `Api-Key secret_live_...`。
        请在 Adapty 看板 -> **App Settings** -> **General** 标签页 -> **API keys** 部分找到此密钥。
  requestBodies:
    DefaultJson:
      required: true
      content:
        application/json:
          schema:
            type: object
  schemas:
    ProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          description: 您的终端用户的名字
        last_name:
          type: string
          nullable: true
          description: 您的终端用户的姓氏
        gender:
          type: string
          nullable: true
          enum:
            - f
            - m
            - o
          description: 您的终端用户的性别
        email:
          type: string
          nullable: true
          format: email
          description: 您的终端用户的电子邮件地址
        phone_number:
          type: string
          nullable: true
          description: 您的终端用户的电话号码
        birthday:
          type: string
          format: date
          nullable: true
          description: 您的终端用户的生日
        ip_country:
          type: string
          nullable: true
          description: 终端用户所在国家/地区，使用两位字母的 ISO 3166-1 alpha-2 代码，例如 `FR`
        ip_v4_address:
          type: string
          nullable: true
          description: 终端用户的 IPv4 地址
        store_country:
          type: string
          nullable: true
          description: 终端用户应用商店所在国家/地区，使用两位字母的 ISO 3166-1 alpha-2 代码，例如 `US`
        store:
          type: string
          nullable: true
          enum:
            - app_store
            - play_store
            - stripe
            - adapty
            - paddle
          description: 用户在您的应用中进行购买所使用的平台
        store_account_token:
          type: string
          format: uuid
          nullable: true
          description: 商店账户令牌
        att_status:
          type: integer
          nullable: true
          enum:
            - 0
            - 1
            - 2
            - 3
          description: Apple 应用跟踪透明度（ATT）状态（0=未确定，1=受限，2=已拒绝，3=已授权）
        analytics_disabled:
          type: boolean
          nullable: true
          description: 用于退出外部分析的选项
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: 允许为用户画像设置最多 30 个自定义属性
        installation_meta:
          $ref: '#/components/schemas/InstallationMeta'
      required:
        - installation_meta
      example:
        first_name: Jane
        last_name: Doe
        gender: f
        email: jane.doe@example.com
        phone_number: '+1234567890'
        birthday: '2000-12-31'
        ip_country: FR
        ip_v4_address: 192.168.1.1
        store_country: US
        store: app_store
        store_account_token: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        att_status: 3
        analytics_disabled: true
        custom_attributes:
          - key: favourite_sport
            value: yoga
        installation_meta:
          device_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          device: iPhone 15 Pro
          locale: en
          os: iOS 17.1
          platform: iOS
          timezone: Europe/Rome
          user_agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_1_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1
          app_build: 1.0.0
          app_version: 1.0.0
          adapty_sdk_version: 2.0.0
          idfa: EA7583CD-A667-48BC-B806-42ECB2B48333
          idfv: E9D48DA5-3930-4B41-8521-D953AECD2F33
          advertising_id: ''
          android_id: ''
          android_app_set_id: ''
    ProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Profile'
      required:
        - data
    Profile:
      type: object
      properties:
        app_id:
          type: string
          format: uuid
          description: 您的应用程序的内部 ID
        profile_id:
          type: string
          format: uuid
          description: Adapty 用户画像 ID
        customer_user_id:
          type: string
          nullable: true
          description: 您的系统中该用户的 ID
        total_revenue_usd:
          type: number
          format: float
          description: 一个浮点数值，表示该用户画像所产生的以美元计算的总收入
        segment_hash:
          type: string
          description: 内部参数
        timestamp:
          type: integer
          format: int64
          description: 响应时间（毫秒），用于解决竞态条件
        custom_attributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: 每个用户画像最多允许设置 30 个自定义属性
        access_levels:
          type: array
          items:
            $ref: '#/components/schemas/AccessLevel'
          description: 访问等级对象数组。如果用户没有任何访问等级，则为空数组
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
          description: 订阅对象数组。如果用户没有任何订阅，则为空数组
        non_subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/NonSubscription'
          description: 一次性购买对象数组。如果用户没有任何购买记录，则为空数组
      required:
        - app_id
        - profile_id
        - customer_user_id
        - total_revenue_usd
        - segment_hash
        - timestamp
        - custom_attributes
        - access_levels
        - subscriptions
        - non_subscriptions
    CustomAttribute:
      type: object
      properties:
        key:
          type: string
          maxLength: 30
          description: 键必须是不超过 30 个字符的字符串。只允许使用字母、数字、破折号、点和下划线
        value:
          oneOf:
            - type: string
            - type: number
          description: 属性值不得超过 50 个字符。值只允许使用字符串和浮点数
      required:
        - key
        - value
    InstallationMeta:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: 唯一设备标识符
        device:
          type: string
          nullable: true
          description: 设备信息
        locale:
          type: string
          nullable: true
          description: 设备语言区域
        os:
          type: string
          nullable: true
          description: 操作系统信息
        platform:
          type: string
          nullable: true
          enum:
            - iOS
            - macOS
            - iPadOS
            - Android
            - visionOS
            - web
          description: 平台（iOS、Android 等）
        timezone:
          type: string
          nullable: true
          description: 设备时区
        user_agent:
          type: string
          nullable: true
          description: 用户代理字符串
        app_build:
          type: string
          nullable: true
          description: 应用构建版本
        app_version:
          type: string
          nullable: true
          description: 应用版本
        adapty_sdk_version:
          type: string
          nullable: true
          description: Adapty SDK 版本
        idfa:
          type: string
          nullable: true
          description: iOS 广告主标识符
        idfv:
          type: string
          nullable: true
          description: iOS 供应商标识符
        advertising_id:
          type: string
          nullable: true
          description: Android 广告 ID
        android_id:
          type: string
          nullable: true
          description: Android 设备 ID
        android_app_set_id:
          type: string
          nullable: true
          description: Android 应用集 ID
      required:
        - device_id
    AccessLevel:
      type: object
      properties:
        access_level_id:
          type: string
          description: 访问等级标识符
        store:
          type: string
          description: 购买该访问等级的商店
        store_product_id:
          type: string
          description: 商店中的产品 ID
        store_base_plan_id:
          type: string
          nullable: true
          description: 商店中的基础方案 ID
        store_transaction_id:
          type: string
          description: 商店中的交易 ID
        store_original_transaction_id:
          type: string
          description: 商店中的原始交易 ID
        offer:
          allOf:
            - $ref: '#/components/schemas/OfferDTO'
          nullable: true
          description: 优惠详情（若应用了促销活动或新用户优惠）
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: 访问等级的生效时间
        purchased_at:
          type: string
          format: date-time
          description: 访问等级的购买时间
        originally_purchased_at:
          type: string
          format: date-time
          description: 访问等级的最初购买时间
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 访问等级的到期时间
        renewal_cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: 续订取消的时间
        billing_issue_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 检测到计费问题的时间
        is_in_grace_period:
          type: boolean
          description: 该访问等级是否处于宽限期
        cancellation_reason:
          type: string
          nullable: true
          description: 取消原因
    Subscription:
      type: object
      properties:
        store:
          type: string
          description: 购买订阅的商店
        store_product_id:
          type: string
          description: 商店中的产品 ID
        store_base_plan_id:
          type: string
          nullable: true
          description: 商店中的基础方案 ID
        store_transaction_id:
          type: string
          description: 商店中的交易 ID
        store_original_transaction_id:
          type: string
          description: 商店中的原始交易 ID
        offer:
          allOf:
            - $ref: '#/components/schemas/OfferDTO'
          nullable: true
          description: 优惠详情（若已应用促销活动或新用户优惠）
        environment:
          type: string
          description: 环境（沙盒、生产）
        purchased_at:
          type: string
          format: date-time
          description: 订阅的购买时间
        originally_purchased_at:
          type: string
          format: date-time
          description: 订阅的首次购买时间
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅的到期时间
        renewal_cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: 取消续订的时间
        billing_issue_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 检测到计费问题的时间
        is_in_grace_period:
          type: boolean
          description: 订阅是否处于宽限期
        cancellation_reason:
          type: string
          nullable: true
          description: 取消原因
    NonSubscription:
      type: object
      properties:
        purchase_id:
          type: string
          format: uuid
          description: 唯一购买标识符
        store:
          type: string
          description: 购买所在的商店
        store_product_id:
          type: string
          description: 商店中的产品 ID
        store_base_plan_id:
          type: string
          nullable: true
          description: 商店中的基础方案 ID
        store_transaction_id:
          type: string
          description: 商店中的交易 ID
        store_original_transaction_id:
          type: string
          description: 商店中的原始交易 ID
        purchased_at:
          type: string
          format: date-time
          description: 购买时间
        environment:
          type: string
          description: 环境（沙盒、生产）
        is_refund:
          type: boolean
          description: 是否为退款
        is_consumable:
          type: boolean
          description: 是否为消耗型商品
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                nullable: true
                description: 错误来源
              errors:
                type: array
                items:
                  type: string
                description: 错误消息数组
        error_code:
          type: string
          description: 简短错误名称
        status_code:
          type: integer
          description: HTTP 状态码
      required:
        - errors
        - error_code
        - status_code
    TransactionDTORequest:
      oneOf:
        - $ref: '#/components/schemas/OneTimePurchaseDTO'
        - $ref: '#/components/schemas/SubscriptionDTO'
      discriminator:
        propertyName: purchase_type
    OneTimePurchaseDTO:
      type: object
      title: One-time Purchase
      description: 一次性购买的交易数据
      properties:
        purchase_type:
          type: string
          enum:
            - one_time_purchase
          description: 购买类型
        store:
          type: string
