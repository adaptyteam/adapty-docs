    SubscriptionDTO:
      type: object
      title: Subscription
      description: 订阅购买的交易数据
      properties:
        purchase_type:
          type: string
          enum:
            - subscription
          description: 购买类型
        store:
          type: string
          description: 发生购买的商店。常见值包括 `app_store`、`play_store`、`stripe`、`paddle` 或任意自定义商店标识符
        environment:
          type: string
          enum:
            - Production
            - Sandbox
          default: Production
          description: 发生购买的环境
        store_product_id:
          type: string
          description: 商店中的产品 ID
        store_transaction_id:
          type: string
          maxLength: 50
          description: 商店中的交易 ID。最多 50 个字符。PayPal 及部分自定义商店的交易 ID 可能超出此限制——提交前请对值进行截断或哈希处理，否则请求将失败。
        store_original_transaction_id:
          type: string
          description: 商店中的原始交易 ID
        is_family_shared:
          type: boolean
          default: false
          description: 该购买是否为家庭共享
        price:
          $ref: '#/components/schemas/PriceDTO'
        purchased_at:
          type: string
          format: date-time
          description: 购买发生的时间
        variation_id:
          type: string
          nullable: true
          description: A/B 测试的实验变体 ID
        offer:
          $ref: '#/components/schemas/OfferDTO'
          nullable: true
        refunded_at:
          type: string
          format: date-time
          nullable: true
          description: 购买退款的时间
        cancellation_reason:
          type: string
          enum:
            - billing_error
            - cancelled_by_developer
            - new_subscription_replace
            - price_increase
            - product_was_not_available
            - refund
            - unknown
            - upgraded
            - voluntarily_cancelled
            - adapty_revoked
          nullable: true
          description: 取消原因
        originally_purchased_at:
          type: string
          format: date-time
          description: 订阅最初购买的时间
        expires_at:
          type: string
          format: date-time
          description: 订阅到期的时间
        renew_status:
          type: boolean
          description: 订阅是否将自动续期
        renew_status_changed_at:
          type: string
          format: date-time
          nullable: true
          description: 续期状态变更的时间
        billing_issue_detected_at:
          type: string
          format: date-time
          nullable: true
          description: 检测到账单问题的时间
        grace_period_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 宽限期到期的时间
