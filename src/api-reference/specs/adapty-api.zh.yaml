  /api/v2/server-side-api/vc/transactions/:
    post:
      summary: 创建虚拟货币交易
      description: |
        在单个原子事务中为用户画像充值或扣除一种或多种虚拟货币。使用正数 `amount` 表示充值（授予），负数 `amount` 表示扣除（消费）。所有条目一起应用——如果任何条目失败，则全部不应用。

        每个货币代码在每次请求中只能出现一次。通过此端点进行的充值始终创建永不过期的余额。
      operationId: createVirtualCurrencyTransaction
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: 您系统中客户的唯一 ID。`adapty-customer-user-id` 或 `adapty-profile-id` 二者必填其一。
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: 您系统中用户画像的唯一 ID。如果您正在使用匿名用户画像，这是最佳选择。`adapty-customer-user-id` 或 `adapty-profile-id` 二者必填其一。
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            使请求具有幂等性的 UUID v4。如果您使用相同的密钥重试请求，Adapty 将返回原始事务的结果，而不会再次更改余额。必须是有效的 UUID v4。

            密钥的记忆时间最长为一小时，且范围限定为单个用户画像。超过该时间窗口后，使用相同密钥的请求将作为新事务应用——因此请使用该密钥安全地重试调用，而不是用于长期内的重复授予去重。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualCurrencyTransactionRequest'
            examples:
              debit:
                summary: 消费（扣除）一种货币
                value:
                  items:
                    - currency_code: COINS
                      amount: -10
              credit:
                summary: 授予（充值）一种货币
                value:
                  items:
                    - currency_code: COINS
                      amount: 500
              multi_currency:
                summary: 同时扣除两种货币
                value:
                  items:
                    - currency_code: GOLD
                      amount: -50
                    - currency_code: SILVER
                      amount: -200
              conversion:
                summary: 将一种货币兑换为另一种货币
                value:
                  items:
                    - currency_code: SILVER
                      amount: -100
                    - currency_code: GOLD
                      amount: 10
                  metadata:
                    reason: exchange
      responses:
        '200':
          description: 事务应用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionResponse'
              example:
                transaction_id: 0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90
                balances:
                  - code: COINS
                    name: Gold Coins
                    balance: 12950
                    held: 0
                    available: 12950
        '400':
          description: |
            错误请求。`error_code` 字段标识原因：`insufficient_balance`、`unknown_currency`、`duplicate_currency`、`amount_zero`、`balance_overflow`、`empty_items` 或 `idempotency_key_invalid`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: currency_code
                    errors:
                      - Insufficient balance for currency COINS
                error_code: insufficient_balance
                status_code: 400
        '401':
          description: 未授权。API 密钥缺失或无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 禁止访问。此应用未启用虚拟货币的 Server API。请联系 Adapty 支持以申请访问权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors:
                      - Server API for virtual currencies is not enabled for this app. Contact Adapty support to request access.
                error_code: feature_not_enabled
                status_code: 403
        '404':
          description: 未找到用户画像。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            冲突。`error_code` 字段标识原因：

            - `idempotency_in_flight` — 具有相同 `Idempotency-Key` 的请求仍在处理中。在 `Retry-After` 响应头指定的时间间隔后重试。
            - `duplicate_source_transaction` — 底层存储事务已被充值，因此不会再次应用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - source: null
                    errors:
                      - A similar request is being processed.
                error_code: idempotency_in_flight
                status_code: 409
        '422':
          description: |
            不可处理的实体。请求体未通过 schema 验证——例如，`items` 包含超过 20 个条目，或 `metadata` 的键或值违反了其约束条件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            请求过多。超出了每个应用或全局速率限制（`error_code` 为 `rate_limited`）。默认限制为每个应用每分钟 600 次请求，全局每分钟 6000 次请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部服务器错误
    get:
      summary: 列出虚拟货币交易记录
      description: |
        返回用户画像的虚拟货币交易历史记录，按最新优先排序。结果使用游标分页：当响应包含非空的 `pagination.next_cursor` 时，将其作为 `cursor` 查询参数传回以获取下一页。
      operationId: listVirtualCurrencyTransactions
      tags:
        - Virtual Currency
      security:
        - apikeyAuth: []
      parameters:
        - name: adapty-customer-user-id
          in: header
          required: false
          schema:
            type: string
          description: 您系统中客户的唯一 ID。`adapty-customer-user-id` 或 `adapty-profile-id` 二者必填其一。
        - name: adapty-profile-id
          in: header
          required: false
          schema:
            type: string
          description: 您系统中用户画像的唯一 ID。如果您正在使用匿名用户画像，这是最佳选择。`adapty-customer-user-id` 或 `adapty-profile-id` 二者必填其一。
        - name: currency_code
          in: query
          required: false
          schema:
            type: string
          description: 将历史记录过滤为单个虚拟货币代码。
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 上一个响应中作为 `pagination.next_cursor` 返回的不透明分页游标。省略则获取第一页。
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: 每页返回的最大事务数。默认为 50。
      responses:
        '200':
          description: 交易历史记录返回成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryResponse'
              example:
                data:
                  - transaction_id: 0190e8a4-1c2b-7def-8abc-2c1a4b6d8e90
                    transaction_type: api_transaction
                    items:
                      - currency_code: COINS
                        amount: 500
                        balance_after: 12950
                    metadata:
                      reason: promo_bonus
                    created_at: '2026-05-23T10:30:00Z'
                  - transaction_id: 0190e7b2-9a44-7c10-bb31-7d2e9f0a1c55
                    transaction_type: store_purchase
                    items:
                      - currency_code: COINS
                        amount: 1000
                        balance_after: 12450
                    created_at: '2026-05-22T18:05:12Z'
                  - transaction_id: 0190e5c0-3f18-7b9a-9e6d-44a1c8b27e03
                    transaction_type: subscription_renewal
                    items:
                      - currency_code: GEMS
                        amount: 200
                        balance_after: 3280
                    created_at: '2026-05-20T09:00:00Z'
                pagination:
                  next_cursor: MjAyNi0wNS0yMFQwOTowMDowMFowMTkwZTVjMC0zZjE4LTdiOWEtOWU2ZC00NGExYzhiMjdlMDM=
        '400':
          description: 错误请求。`cursor` 值无效（`error_code` 为 `invalid_cursor`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未授权。API 密钥缺失或无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 禁止访问。此应用未启用虚拟货币的 Server API。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到用户画像。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部服务器错误
  /api/v2/server-side-api/vc/balances/:
    get:
      summary: 列出虚拟货币余额
      description: |
        返回某个用户画像所有虚拟货币的当前余额。如果应用没有虚拟货币，`data` 为空数组。
      operationId: listVirtualCurrencyBalances
