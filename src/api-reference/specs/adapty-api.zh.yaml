      properties:
        locale:
          type: string
          description: 远程配置的语言环境（例如："en"、"es"、"fr"）
        data:
          type: string
          description: 包含远程配置数据的 JSON 字符串
      required:
        - locale
        - data
    IntegrationIdentifiersObject:
      type: object
      description: |
        集成标识符包含来自各种第三方服务的用户 ID。
        这些 ID 用于在不同的分析和营销平台之间同步用户数据。
      properties:
        adjust_device_id:
          type: string
          nullable: true
          description: 用户在 Adjust 集成中的网络用户 ID
        airbridge_device_id:
          type: string
          nullable: true
          description: 用户设备在 Airbridge 集成中的 ID
        amplitude_device_id:
          type: string
          nullable: true
          description: 用户设备在 Amplitude 集成中的 ID
        amplitude_user_id:
          type: string
          nullable: true
          description: 用户在 Amplitude 集成中的 ID
        appmetrica_device_id:
          type: string
          nullable: true
          description: 用户设备在 AppMetrica 集成中的 ID
        appmetrica_profile_id:
          type: string
          nullable: true
          description: 用户在 AppMetrica 集成中的 ID
        appsflyer_id:
          type: string
          nullable: true
          description: 用户在 AppsFlyer 集成中的网络用户 ID
        branch_id:
          type: string
          nullable: true
          description: 用户应用在 Branch 集成中的 Branch Key
        facebook_anonymous_id:
          type: string
          nullable: true
          description: 用户在 Facebook Ads 集成中的 ID
        firebase_app_instance_id:
          type: string
          nullable: true
          description: 用户在 Firebase 集成中的 ID
        mixpanel_user_id:
          type: string
          nullable: true
          description: 用户在 Mixpanel 集成中的 ID
        one_signal_player_id:
          type: string
          nullable: true
          description: 用户在 OneSignal 集成中的 ID（旧版标识符）
        one_signal_subscription_id:
          type: string
          nullable: true
          description: 用户在 OneSignal 集成中的 ID（推荐标识符）
        posthog_distinct_user_id:
          type: string
          nullable: true
          description: 用户在 PostHog 集成中的 ID
        pushwoosh_hwid:
          type: string
          nullable: true
          description: 用户设备在 Pushwoosh 集成中的 ID
        tenjin_analytics_installation_id:
          type: string
          nullable: true
          description: 用户设备在 Tenjin 集成中的 ID
    RefundSaverSettingsObject:
      type: object
      description: |
        退款保护设置包含用户处理退款请求的偏好设置。
        这包括数据共享同意及自定义退款偏好。
      properties:
        consent:
          type: boolean
          description: 定义用户是否同意共享其数据
        custom_preference:
          type: string
          enum:
            - grant
            - grant_prorated
            - no_preference
            - decline
          description: 退款偏好
      required:
        - consent
        - custom_preference
    ErrorObject:
      type: object
      description: |
        错误对象表示一个 API 错误响应。它包含有关
        出错原因及修复方法的信息。
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                nullable: true
                description: 导致错误的字段或参数
              errors:
                type: array
                items:
                  type: string
                description: 错误消息数组
            required:
              - errors
          description: 错误详情数组
        error_code:
          type: string
          description: 机器可读的错误代码
        status_code:
          type: integer
          description: HTTP 状态码
      required:
        - errors
        - error_code
        - status_code
    PaginationObject:
      type: object
      description: |
        列表端点的分页元数据。包含有关当前页面和结果总数的信息。
      properties:
        count:
          type: integer
          description: 项目总数
        page:
          type: integer
          description: 当前页码
        pages:
          type: integer
          description: 总页数
      required:
        - count
        - page
        - pages
    VirtualCurrencyTransactionRequest:
      type: object
      description: 创建虚拟货币交易的请求体。
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: 以原子方式应用的余额调整。每个货币代码只能出现一次。
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceAdjustment'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            与交易一同存储的可选键值对。最多 5 个键。每个键匹配 `^[a-z0-9_]{1,30}$`，每个值最多 200 个字符。
      required:
        - items
    VirtualCurrencyBalanceAdjustment:
      type: object
      properties:
        currency_code:
          type: string
          description: 要调整的虚拟货币代码。
        amount:
          type: integer
          format: int32
          description: |
            要应用的金额。正值表示充入（授予）货币；负值表示扣除（消费）货币。不能为零。
      required:
        - currency_code
        - amount
    VirtualCurrencyTransactionResponse:
      type: object
      description: 虚拟货币交易的结果。
      properties:
        transaction_id:
          type: string
          format: uuid
          description: 已创建交易的唯一 ID。
        balances:
          type: array
          description: |
            本次请求中每种受影响货币的交易后余额（每个 `items` 条目对应一条记录）。如需读取用户画像的完整余额列表，请使用 `GET /api/v2/server-side-api/vc/balances/`。
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceSnapshot'
      required:
        - transaction_id
        - balances
    VirtualCurrencyBalanceSnapshot:
      type: object
      properties:
        code:
          type: string
          description: 虚拟货币代码。
        name:
          type: string
          description: 虚拟货币的显示名称。
        balance:
          type: integer
          format: int32
          minimum: 0
          description: 总余额，包含当前持有的金额。
        held:
          type: integer
          format: int32
          minimum: 0
          description: 所有有效持有金额的总和（已预留金额）。当前始终为 0。
        available:
          type: integer
          format: int32
          description: 可用于消费的余额，计算方式为 `balance - held`。
      required:
        - code
        - name
        - balance
        - held
        - available
    VirtualCurrencyBalanceListResponse:
      type: object
      description: 用户画像所有虚拟货币的当前余额。
      properties:
        response_created_at:
          type: integer
          format: int64
          description: 响应生成的时间，以毫秒为单位的 Unix 时间戳。
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyProfileBalanceItem'
      required:
        - response_created_at
        - data
    VirtualCurrencyProfileBalanceItem:
      type: object
      properties:
        code:
          type: string
          description: 应用内唯一的虚拟货币代码。由 ASCII 字母、数字和下划线组成。
        name:
          type: string
          description: 虚拟货币的显示名称。
        balance:
          type: integer
          format: int32
          minimum: 0
          description: 总余额，包含当前被冻结的金额。
        held:
          type: integer
          format: int32
          minimum: 0
          description: 所有有效冻结金额的总和（已预留金额）。当前始终为 0。
        available:
          type: integer
          format: int32
          description: 可用于消费的余额，计算方式为 `balance - held`。
      required:
        - code
        - name
        - balance
        - held
        - available
    VirtualCurrencyTransactionsHistoryResponse:
      type: object
      description: 用户画像的虚拟货币交易记录分页列表。
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VirtualCurrencyTransactionsHistoryItem'
        pagination:
          $ref: '#/components/schemas/VirtualCurrencyHistoryPagination'
      required:
        - data
        - pagination
    VirtualCurrencyTransactionsHistoryItem:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
          description: 交易的唯一 ID。
        transaction_type:
          type: string
          description: |
            交易的来源。可选值为 `store_purchase`、`subscription_renewal`、`trial_start`、`api_transaction`、`dashboard_transaction`、`refund` 或 `expiry`。
        items:
          type: array
          description: 本次交易中记录的各币种余额变动。
          items:
            $ref: '#/components/schemas/VirtualCurrencyBalanceChange'
        metadata:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: 与交易一同存储的键值对（如有）。
        created_at:
          type: string
          format: date-time
          description: 交易的记录时间。
      required:
        - transaction_id
        - transaction_type
        - items
        - created_at
    VirtualCurrencyBalanceChange:
      type: object
      properties:
        currency_code:
          type: string
          description: 虚拟货币代码。
        amount:
          type: integer
          format: int32
          description: 应用于余额的带符号变动量。正值为充值，负值为扣除。
        balance_after:
          type: integer
          format: int32
          minimum: 0
          description: 本次交易应用后的货币余额。
      required:
        - currency_code
        - amount
        - balance_after
    VirtualCurrencyHistoryPagination:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: |
            下一页的不透明游标。将其作为 `cursor` 查询参数传递以获取更多结果。当没有更多页面时为 Null。
      required:
        - next_cursor
